name: sync-posthog-topics

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install yq (mikefarah)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.47.1/yq_linux_amd64 \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          yq --version

      - name: Update Kafka topics from upstream
        run: |
          set -euo pipefail
          POSTHOG_REF="$(yq -r '.appVersion' charts/posthog/Chart.yaml)"
          export POSTHOG_REF
          [[ "$POSTHOG_REF" =~ ^[0-9a-f]{40}$ ]]
          bash scripts/update-topics.sh

      - name: Create pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
          add-paths: charts/posthog/values.yaml
          branch: chore/sync-posthog-topics
          base: main
          delete-branch: true
          commit-message: "chore: sync PostHog Kafka topics"
          title: "chore: sync PostHog Kafka topics"
          body: |
            Sync Kafka topics from the immutable upstream commit in
            `charts/posthog/Chart.yaml` (`appVersion`), using both
            `posthog/kafka_client/topics.py` and
            `nodejs/src/common/config/kafka-topics.ts`.

            Generated by `scripts/update-topics.sh`. Review and bump the chart
            version before merging; normal PR checks must pass.
          labels: |
            automated
            dependencies
      - name: Dispatch checks for owned bot PR heads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NATIVE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [[ -z "$NATIVE_TOKEN" ]]; then python3 scripts/verify-release-dispatch.py chore/sync-posthog-topics; fi
