name: publish-posthog-artifacts

# Called only after release-ready in kind-happy-path; never rebuild at publish time.
on:
  workflow_call:
    inputs:
      publish_images:
        required: true
        type: boolean
      publish_chart:
        required: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: publish tested ${{ matrix.image }} (${{ matrix.arch }})
    if: github.ref == 'refs/heads/main' && inputs.publish_images
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: posthog-web, arch: amd64, runner: ubuntu-24.04}
          - {image: posthog-worker, arch: amd64, runner: ubuntu-24.04}
          - {image: posthog-worker-exports, arch: amd64, runner: ubuntu-24.04}
          - {image: posthog-migrate, arch: amd64, runner: ubuntu-24.04}
          - {image: posthog-cyclotron-migrate, arch: amd64, runner: ubuntu-24.04}
          - {image: posthog-clickhouse, arch: amd64, runner: ubuntu-24.04}
          - {image: posthog-clickhouse, arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-${{ matrix.image }}-${{ matrix.arch }}
          path: dist
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image without rebuilding
        env:
          ROLE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          test "$(cat dist/revision)" = "$GITHUB_SHA"
          docker load -i dist/image.tar
          SOURCE="posthog-ci/${ROLE}:${GITHUB_SHA}-${ARCH}"
          test "$(docker inspect -f '{{.Id}}' "$SOURCE")" = "$(jq -r '.[0].Id' dist/image.json)"
          TARGET="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${ROLE}:sha-${GITHUB_SHA}-${ARCH}"
          docker tag "$SOURCE" "$TARGET"
          docker push "$TARGET"
          docker image inspect "$TARGET" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"

  image-tags:
    name: tag tested image bundle
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.28.0
          driver-opts: image=moby/buildkit:v0.23.2
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish revision tags and validated update channel
        run: |
          set -euo pipefail
          for role in web worker worker-exports migrate cyclotron-migrate clickhouse; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/posthog-${role}"
            sources=("${image}:sha-${GITHUB_SHA}-amd64")
            tags=(-t "${image}:sha-${GITHUB_SHA}" -t "${image}:latest")
            if [[ "$role" == clickhouse ]]; then
              sources+=("${image}:sha-${GITHUB_SHA}-arm64")
              base="$(awk '$1=="FROM"{ref=$2} END{print ref}' images/clickhouse/Dockerfile)"
              base="${base%%@*}"
              version="${base##*:}"
              [[ "$version" != "$base" && "$version" =~ ^[0-9][a-zA-Z0-9_.-]*$ ]]
              tags+=(-t "${image}:${version}")
            fi
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
            docker buildx imagetools inspect "${image}:sha-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          done

  chart:
    name: publish tested chart
    needs: image-tags
    if: always() && github.ref == 'refs/heads/main' && inputs.publish_chart && ((!inputs.publish_images && needs.image-tags.result == 'skipped') || needs.image-tags.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chart
          path: dist
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.18.4
      - name: Push exact tested package when chart version changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          test "$(cat dist/revision)" = "$GITHUB_SHA"
          previous=""
          if [[ -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            previous="$(git show "${PUSH_BEFORE}:charts/posthog/Chart.yaml" | sed -n 's/^version: *//p')"
          fi
          current="$(sed -n 's/^version: *//p' charts/posthog/Chart.yaml)"
          if [[ "$previous" == "$current" ]]; then
            echo "Chart version unchanged ($current); no chart publication." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push dist/posthog-*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
