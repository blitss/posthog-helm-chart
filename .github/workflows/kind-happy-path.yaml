name: kind-happy-path

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Optional comparison base for owned bot PR checks"
        type: string
        default: ""
      expected_head:
        description: "Refuse a moved bot branch rather than testing a different head"
        type: string
        default: ""
  pull_request:
  merge_group:
  push:
    branches: [main]

# Serialize main releases so an older run cannot move latest after a newer one.
concurrency:
  group: posthog-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  KIND_CLUSTER_NAME: posthog-ci
  LOCAL_REGISTRY_NAME: kind-registry
  LOCAL_REGISTRY_PORT: "5001"
  HELM_VERSION: v3.18.4
  FLUX_VERSION: 2.6.4

jobs:
  plan:
    name: classify release inputs
    runs-on: ubuntu-24.04
    outputs:
      runtime: ${{ steps.changes.outputs.runtime }}
      publish-images: ${{ steps.changes.outputs.publish-images }}
      publish-chart: ${{ steps.changes.outputs.publish-chart }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate reproducibility tooling
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          python3 -m venv /tmp/posthog-ops-venv
          /tmp/posthog-ops-venv/bin/pip install -r requirements-ops.txt
          /tmp/posthog-ops-venv/bin/python scripts/test-reconcile-clickhouse-logs.py
          /tmp/posthog-ops-venv/bin/python scripts/test-check-hub-production.py
          bash scripts/test-update-topics.sh
          for mode in fresh upgrade; do
            for phase in prepare backup infrastructure logs migrate rollout verify; do
              /tmp/posthog-ops-venv/bin/python scripts/deploy-hub-production.py "$phase" \
                --context nonexistent-plan-only-context --mode "$mode" --state-dir /tmp/posthog-offline-plan
            done
          done
          test ! -e /tmp/posthog-offline-plan
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base_sha }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          if [[ -n "$EXPECTED_HEAD" ]]; then test "$EXPECTED_HEAD" = "$GITHUB_SHA"; fi
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            printf 'runtime=true\npublish-images=true\npublish-chart=true\n' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE" "$GITHUB_SHA" > /tmp/changed-paths
            python3 - <<'PY'
          import os, pathlib, re, subprocess
          paths = pathlib.Path("/tmp/changed-paths").read_text().splitlines()
          prefixes = (".github/workflows/", "charts/", "images/", "vendor/", "manifests/", "scripts/", "kind-config")
          files = {".github/renovate.json5", ".dockerignore", "mise.toml", "requirements-ops.txt"}
          runtime = any(not p.endswith(".md") and (p.startswith(prefixes) or p in files) for p in paths)
          # A deployment-pin PR must be tested, but rebuilding/promoting it would
          # produce another digest-only Renovate PR forever (labels include SHA).
          image_files = {
              ".dockerignore", ".github/workflows/build-posthog-images.yaml",
              "charts/posthog/files/web-startup.sh",
          }
          publish_images = any(
              not p.endswith(".md") and (p.startswith(("images/", "vendor/")) or p in image_files)
              for p in paths
          )
          def chart_version(ref):
              chart = subprocess.check_output(["git", "show", f"{ref}:charts/posthog/Chart.yaml"], text=True)
              return re.search(r"^version:\s*(.+)$", chart, re.MULTILINE).group(1).strip()
          publish_chart = chart_version(os.environ["BASE"]) != chart_version(os.environ["GITHUB_SHA"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"runtime={str(runtime).lower()}\n")
              output.write(f"publish-images={str(publish_images).lower()}\n")
              output.write(f"publish-chart={str(publish_chart).lower()}\n")
          PY
          fi

  build:
    needs: plan
    if: needs.plan.outputs.runtime == 'true'
    uses: ./.github/workflows/build-posthog-images.yaml

  happy-path:
    name: manifests happy path (${{ matrix.images }})
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        images: [declared, hub-production, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Free runner disk
        shell: bash
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/lib/jvm \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/share/swift
          docker image prune --all --force
          docker builder prune --all --force
          df -h

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4


      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.18.4

      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.33.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chart
          path: /tmp/chart

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.images == 'candidate'
        with:
          pattern: image-*-amd64
          path: /tmp/images

      - name: Install kind and Flux
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64 -o /tmp/kind
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          curl -fsSL "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz" | tar -xz -C /tmp flux
          sudo install -m 0755 /tmp/flux /usr/local/bin/flux
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.47.1/yq_linux_amd64 -o /tmp/yq
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          kind version
          flux --version
          kubectl version --client=true
          helm version

      - name: Start local OCI registry
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --restart=always \
            -p "127.0.0.1:${LOCAL_REGISTRY_PORT}:5000" \
            --name "${LOCAL_REGISTRY_NAME}" \
            registry:2

      - name: Create kind cluster
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/kind-ci.yaml <<EOF
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          containerdConfigPatches:
            - |-
              [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:${LOCAL_REGISTRY_PORT}"]
                endpoint = ["http://${LOCAL_REGISTRY_NAME}:5000"]
          nodes:
            - role: control-plane
          EOF

          kind create cluster --name "${KIND_CLUSTER_NAME}" --image kindest/node:v1.33.1@sha256:050072256b9a903bd914c0b2866828150cb229cea0efe5892e2b644d5dd3b34f --config /tmp/kind-ci.yaml
          docker network connect kind "${LOCAL_REGISTRY_NAME}" || true
          kubectl get nodes -o wide

      - name: Load exact same-run test artifacts
        shell: bash
        env:
          IMAGE_MODE: ${{ matrix.images }}
        run: |
          set -euo pipefail
          (cd /tmp/chart && sha256sum --check SHA256SUMS)
          test "$(cat /tmp/chart/revision)" = "$GITHUB_SHA"
          helm push --plain-http /tmp/chart/posthog-*.tgz "oci://localhost:${LOCAL_REGISTRY_PORT}/charts"
          if [[ "$IMAGE_MODE" == candidate ]]; then
            for archive in /tmp/images/image-*-amd64; do
              (cd "$archive" && sha256sum --check SHA256SUMS)
              test "$(cat "$archive/revision")" = "$GITHUB_SHA"
              docker load -i "$archive/image.tar"
              source="$(jq -r '.[0].RepoTags[0]' "$archive/image.json")"
              test "$(docker inspect -f '{{.Id}}' "$source")" = "$(jq -r '.[0].Id' "$archive/image.json")"
              role="${source#posthog-ci/}"; role="${role%%:*}"
              docker tag "$source" "localhost:${LOCAL_REGISTRY_PORT}/${role}:${GITHUB_SHA}"
              docker push "localhost:${LOCAL_REGISTRY_PORT}/${role}:${GITHUB_SHA}"
              rm "$archive/image.tar"
            done
          fi

      - name: Install Flux
        shell: bash
        run: |
          set -euo pipefail
          flux install --version="v${FLUX_VERSION}"
          kubectl -n flux-system rollout status deploy/source-controller --timeout=5m
          kubectl -n flux-system rollout status deploy/helm-controller --timeout=5m

      - name: Prepare CI manifest overlay
        shell: bash
        run: |
          set -euo pipefail
          cp -a manifests /tmp/ci-manifests

          CHART_VERSION="$(yq '.version' charts/posthog/Chart.yaml)"
          export CHART_VERSION
          yq -i '.spec.url = "oci://ci-registry.posthog.svc.cluster.local:5000/charts/posthog" | .spec.insecure = true | .spec.ref = {"tag": strenv(CHART_VERSION)}' /tmp/ci-manifests/posthog/ocirepository.yaml

          kubectl create namespace posthog --dry-run=client -o yaml | kubectl apply -f -
          REGISTRY_IP="$(docker inspect -f '{{.NetworkSettings.Networks.kind.IPAddress}}' "${LOCAL_REGISTRY_NAME}")"
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Service
          metadata:
            name: ci-registry
            namespace: posthog
          spec:
            ports:
              - name: registry
                port: 5000
                targetPort: 5000
          ---
          apiVersion: v1
          kind: Endpoints
          metadata:
            name: ci-registry
            namespace: posthog
          subsets:
            - addresses:
                - ip: ${REGISTRY_IP}
              ports:
                - name: registry
                  port: 5000
          EOF

          kubectl apply -f /tmp/ci-manifests/infra/namespaces.yaml
          kubectl create namespace elastic-system --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace secretgen-controller --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply --dry-run=server -k /tmp/ci-manifests/infra

      - name: Apply infra manifests
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -k /tmp/ci-manifests/infra

          kubectl wait --for=condition=Ready helmrelease/cert-manager -n cert-manager --timeout=15m
          kubectl wait --for=condition=Ready helmrelease/cnpg -n cnpg-system --timeout=15m
          kubectl wait --for=condition=Ready helmrelease/clickhouse-operator -n posthog --timeout=15m
          kubectl wait --for=condition=Ready helmrelease/redpanda-operator -n posthog --timeout=15m

          kubectl -n secretgen-controller rollout status deploy/secretgen-controller --timeout=10m
          kubectl -n elastic-system rollout status statefulset/elastic-operator --timeout=10m
          kubectl -n posthog rollout status deploy/clickhouse-operator-altinity-clickhouse-operator --timeout=10m
          kubectl -n posthog rollout status deploy/redpanda-operator --timeout=10m

      - name: Apply PostHog manifests
        shell: bash
        run: |
          set -euo pipefail

          dump_posthog() {
            kubectl get helmrelease,ocirepository -n posthog || true
            kubectl get nodes -o custom-columns=NAME:.metadata.name,CPU:.status.allocatable.cpu,MEMORY:.status.allocatable.memory || true
            kubectl get jobs -n posthog -o wide || true
            kubectl get pods -n posthog -o wide || true
            kubectl get events -n posthog --sort-by=.lastTimestamp | tail -120 || true

            echo "--- pod memory requests ---"
            kubectl get pods -n posthog -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{range .spec.containers[*]}{.name}{"="}{.resources.requests.memory}{","}{end}{"\n"}{end}' || true

            echo "--- helmrelease/posthog conditions ---"
            kubectl get helmrelease posthog -n posthog -o jsonpath='{range .status.conditions[*]}{.type}={.status} {.reason} {.message}{"\n"}{end}' || true

            echo "--- not-ready pods ---"
            kubectl get pods -n posthog --no-headers 2>/dev/null | awk '
              $3 == "Completed" { next }
              $3 != "Running" { print; next }
              {
                split($2, ready, "/")
                if (ready[1] != ready[2]) print
              }
            ' || true

            echo "--- hook logs ---"
            for job in posthog-db-check posthog-migrate posthog-async-migrations-check posthog-kafka-init posthog-create-buckets; do
              if kubectl get job -n posthog "$job" >/dev/null 2>&1; then
                echo "### $job"
                kubectl logs -n posthog "job/$job" --tail=160 || true
              fi
            done

            echo "--- redpanda logs ---"
            kubectl logs -n posthog posthog-redpanda-0 --all-containers --tail=200 --prefix || true
            kubectl logs -n posthog posthog-redpanda-0 -c redpanda --previous --tail=200 --prefix || true

            echo "--- web logs ---"
            kubectl logs -n posthog -l app.kubernetes.io/component=web --all-containers --tail=120 --prefix || true

            echo "--- worker logs ---"
            kubectl logs -n posthog -l app.kubernetes.io/component=worker --all-containers --tail=120 --prefix || true
          }

          watch_posthog() {
            while true; do
              echo "::group::posthog cluster state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              dump_posthog
              echo "::endgroup::"
              sleep 30
            done
          }

          fail_fast_on_cluster_errors() {
            failed_jobs="$(kubectl get jobs -n posthog -o jsonpath='{range .items[?(@.status.failed>0)]}{.metadata.name}{" "}{end}' 2>/dev/null || true)"
            if [[ -n "${failed_jobs}" ]]; then
              echo "failed jobs: ${failed_jobs}" >&2
              return 1
            fi

            fatal_pods="$(
              kubectl get pods -n posthog --no-headers 2>/dev/null | awk '
                $3 ~ /CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|RunContainerError|PostStartHookError|OOMKilled/ { print }
              '
            )"
            if [[ -n "${fatal_pods}" ]]; then
              echo "fatal pod states:" >&2
              echo "${fatal_pods}" >&2
              return 1
            fi

            unschedulable="$(
              kubectl get events -n posthog --field-selector reason=FailedScheduling --sort-by=.lastTimestamp 2>/dev/null | tail -20 | grep -E 'Insufficient|didn.t match|node\\(s\\) had' || true
            )"
            if [[ -n "${unschedulable}" ]]; then
              echo "unschedulable pods:" >&2
              echo "${unschedulable}" >&2
              return 1
            fi

          }

          watch_posthog &
          WATCH_PID="$!"
          trap 'kill "${WATCH_PID}" 2>/dev/null || true' EXIT

          # Materialize resource patches first, then substitute ONLY in the candidate
          # lane. The declared lane tests every proposed image/digest as committed.
          kubectl kustomize /tmp/ci-manifests/posthog-ci > /tmp/posthog-ci.yaml
          if [[ "${{ matrix.images }}" == hub-production ]]; then
            yq -o=json manifests/hub-production/release.yaml > /tmp/profile.json
            yq -o=json 'select(.kind == "HelmRelease" and .metadata.name == "posthog")' /tmp/posthog-ci.yaml \
              | python3 scripts/verify-release-profile-images.py /tmp/profile.json > /tmp/profile-release.json
            yq -i '(select(.kind == "HelmRelease" and .metadata.name == "posthog")) = load("/tmp/profile-release.json")' /tmp/posthog-ci.yaml
            # ClickHouse is an operator CR, not a HelmRelease image value.
            CH_IMAGE="$(yq -er '.spec.templates.podTemplates[].spec.containers[] | select(.name == "clickhouse") | .image' manifests/hub-production/clickhouse.yaml)"
            export CH_IMAGE="${CH_IMAGE#registry.streamloop.app/}"
            [[ "$CH_IMAGE" =~ ^[^[:space:]]+@sha256:[0-9a-f]{64}$ ]]
            yq -i '(select(.kind == "ClickHouseInstallation") | .spec.templates.podTemplates[].spec.containers[] | select(.name == "clickhouse") | .image) = strenv(CH_IMAGE)' /tmp/posthog-ci.yaml
          fi
          if [[ "${{ matrix.images }}" == candidate ]]; then
            for pair in posthog:web web:web worker:worker workerBeat:worker temporalDjangoWorker:worker workerExports:worker-exports migrate:migrate asyncMigrationsCheck:migrate cyclotronMigrate:cyclotron-migrate; do
              export COMPONENT="${pair%%:*}" ROLE="${pair#*:}"
              yq -i '(select(.kind == "HelmRelease" and .metadata.name == "posthog") | .spec.values[strenv(COMPONENT)].image) = {"repository": ("localhost:" + strenv(LOCAL_REGISTRY_PORT) + "/posthog-" + strenv(ROLE)), "tag": strenv(GITHUB_SHA), "pullPolicy": "IfNotPresent"}' /tmp/posthog-ci.yaml
            done
            yq -i '(select(.kind == "ClickHouseInstallation") | .spec.templates.podTemplates[].spec.containers[] | select(.name == "clickhouse") | .image) = ("localhost:" + strenv(LOCAL_REGISTRY_PORT) + "/posthog-clickhouse:" + strenv(GITHUB_SHA))' /tmp/posthog-ci.yaml
          fi
          kubectl apply -f /tmp/posthog-ci.yaml
          kubectl wait --for=condition=Ready ocirepository/posthog-chart -n posthog --timeout=10m

          # Always migrate a fresh database. Cross-revision dumps can hide broken
          # fresh installs or carry incompatible schema past the migration gate.
          kubectl wait --for=condition=Ready clusters.postgresql.cnpg.io/posthog-pg -n posthog --timeout=10m
          kubectl patch helmrelease posthog -n posthog --type=merge -p '{"spec":{"suspend":false}}'
          kubectl annotate helmrelease posthog -n posthog \
            reconcile.fluxcd.io/requestedAt="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --overwrite

          deadline=$((SECONDS + 4500))
          while true; do
            if ! fail_fast_on_cluster_errors; then
              dump_posthog
              exit 1
            fi

            ready="$(kubectl get helmrelease posthog -n posthog -o jsonpath='{range .status.conditions[?(@.type=="Ready")]}{.status}{end}' 2>/dev/null || true)"
            if [[ "${ready}" == "True" ]]; then
              break
            fi

            if (( SECONDS > deadline )); then
              echo "timed out waiting for helmrelease/posthog to become Ready" >&2
              dump_posthog
              exit 1
            fi

            sleep 10
          done

          deadline=$((SECONDS + 600))
          while true; do
            if ! fail_fast_on_cluster_errors; then
              dump_posthog
              exit 1
            fi

            not_ready="$(
              kubectl get pods -n posthog --no-headers | awk '
                $3 == "Completed" { next }
                $3 != "Running" { print; next }
                {
                  split($2, ready, "/")
                  if (ready[1] != ready[2]) print
                }
              '
            )"
            if [[ -z "${not_ready}" ]]; then
              kubectl get pods -n posthog -o wide
              break
            fi
            if (( SECONDS > deadline )); then
              echo "timed out waiting for PostHog pods:" >&2
              echo "${not_ready}" >&2
              exit 1
            fi
            echo "${not_ready}"
            sleep 15
          done

      - name: Verify happy path
        shell: bash
        run: |
          set -euo pipefail

          WEB="$(kubectl get pod -n posthog -l app.kubernetes.io/component=web -o jsonpath='{.items[?(@.status.containerStatuses[0].ready==true)].metadata.name}')"
          if [[ -z "${WEB}" ]]; then
            echo "no ready web pod found" >&2
            exit 1
          fi

          deadline=$((SECONDS + 600))
          while true; do
            PREFLIGHT="$(kubectl exec -n posthog "${WEB}" -- python -c 'import urllib.request; print(urllib.request.urlopen("http://127.0.0.1:8000/_preflight/", timeout=30).read().decode(), end="")')"
            echo "${PREFLIGHT}"
            if PREFLIGHT="${PREFLIGHT}" python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["PREFLIGHT"])
          required_true = ["django", "redis", "plugins", "celery", "clickhouse", "db", "object_storage"]
          bad = [key for key in required_true if payload.get(key) is not True]
          if bad:
              raise SystemExit(f"preflight fields not true: {bad}; payload={payload}")
          PY
            then
              break
            fi
            if (( SECONDS > deadline )); then
              echo "timed out waiting for healthy preflight" >&2
              exit 1
            fi
            sleep 10
          done

          kubectl exec -n posthog posthog-redpanda-0 -c redpanda -- rpk cluster info
          kubectl exec -n posthog posthog-redpanda-0 -c redpanda -- rpk topic list | grep -E '^clickhouse_events_json[[:space:]]'
          kubectl wait --for=condition=Ready redpanda/posthog-redpanda -n posthog --timeout=10m

          CH_PW="$(kubectl get secret posthog-clickhouse-password -n posthog -o jsonpath='{.data.password}' | base64 -d)"
          kubectl exec -n posthog chi-posthog-posthog-0-0-0 -- clickhouse client --password "${CH_PW}" --database system --query "SELECT version()"
          kubectl exec -n posthog chi-posthog-posthog-0-0-0 -- clickhouse client --password "${CH_PW}" --database system --query "SELECT throwIf(count() = 0, 'aggregate_funnel missing') FROM system.functions WHERE name = 'aggregate_funnel'"
          kubectl exec -n posthog chi-posthog-posthog-0-0-0 -- clickhouse client --password "${CH_PW}" --database system --query "SELECT throwIf(count() < 4, 'warpstream named collections missing') FROM system.named_collections WHERE name LIKE 'warpstream_%'"

          # A green preflight alone does not prove the capture/ingestion pipeline.
          kubectl exec -i -n posthog "${WEB}" -- env POSTHOG_RELEASE_SMOKE=disposable-kind /python-runtime/bin/python < scripts/verify-release-smoke.py


      - name: Dump diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          kubectl get nodes -o wide
          kubectl get helmreleases -A
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp | tail -200
          kubectl describe pods -n posthog
          kubectl logs -n flux-system deploy/source-controller --tail=300
          kubectl logs -n flux-system deploy/helm-controller --tail=300
          kubectl logs -n posthog -l app.kubernetes.io/component=web --all-containers --tail=300 --prefix
          kubectl logs -n posthog -l app.kubernetes.io/component=worker --all-containers --tail=300 --prefix
          kubectl logs -n posthog posthog-redpanda-0 --all-containers --tail=300 --prefix
          kubectl logs -n posthog chi-posthog-posthog-0-0-0 --all-containers --tail=300 --prefix
          docker ps -a
          docker logs "${KIND_CLUSTER_NAME}-control-plane" --tail=300

  release-ready:
    name: release-ready
    if: always()
    needs: [plan, build, happy-path]
    runs-on: ubuntu-24.04
    steps:
      - name: Require smoke success or an explicit metadata-only result
        env:
          PLAN: ${{ needs.plan.result }}
          RUNTIME: ${{ needs.plan.outputs.runtime }}
          BUILD: ${{ needs.build.result }}
          SMOKE: ${{ needs.happy-path.result }}
        run: |
          set -euo pipefail
          test "$PLAN" = success
          if [[ "$RUNTIME" == false ]]; then
            test "$BUILD" = skipped && test "$SMOKE" = skipped
          else
            test "$BUILD" = success && test "$SMOKE" = success
          fi

  publish:
    needs: [plan, release-ready]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.plan.outputs.publish-images == 'true' || needs.plan.outputs.publish-chart == 'true')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-posthog-artifacts.yaml
    with:
      publish_images: ${{ needs.plan.outputs.publish-images == 'true' }}
      publish_chart: ${{ needs.plan.outputs.publish-chart == 'true' }}
