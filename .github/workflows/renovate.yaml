name: renovate

on:
  schedule:
    # Twice a day at 06:00 and 18:00 UTC.
    - cron: "0 6,18 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level"
        required: false
        default: "info"
        type: choice
        options:
          - debug
          - info
          - warn
      dryRun:
        description: "Dry-run mode (no PRs created)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "full"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@7e1c0fa7cfd2c3e91b27cdd87ae09a6a0fafb5f2 # v41.0.0
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "ignored"
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun || 'false' }}
        with:
          configurationFile: .github/renovate.json5
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Dispatch checks for owned bot PR heads
        if: inputs.dryRun != 'full'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NATIVE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [[ -z "$NATIVE_TOKEN" ]]; then python3 scripts/verify-release-dispatch.py renovate/; fi
