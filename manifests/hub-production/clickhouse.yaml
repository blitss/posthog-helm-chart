{
  "apiVersion": "clickhouse.altinity.com/v1",
  "kind": "ClickHouseInstallation",
  "spec": {
    "configuration": {
      "clusters": [
        {
          "layout": {
            "replicasCount": 1,
            "shardsCount": 1
          },
          "name": "posthog",
          "secret": {
            "auto": "true"
          }
        }
      ],
      "files": {
        "config.d/named_collections.xml": "<clickhouse>\n  <named_collections>\n    <msk_cluster>\n      <kafka_broker_list from_env=\"KAFKA_HOSTS\"/>\n    </msk_cluster>\n    <warpstream_ingestion>\n      <kafka_broker_list from_env=\"KAFKA_HOSTS\"/>\n    </warpstream_ingestion>\n    <!--\n      warpstream_calculated_events / warpstream_replay / warpstream_shared\n      are created at runtime via CREATE NAMED COLLECTION (persisted to\n      /var/lib/clickhouse/named_collections/*.sql). They cannot also be\n      defined here \u2014 CH 25.x rejects startup if SQL- and XML-defined\n      named collections overlap by name (NAMED_COLLECTION_ALREADY_EXISTS).\n    -->\n  </named_collections>\n</clickhouse>\n",
        "config.d/posthog_macros.xml": "<clickhouse>\n  <macros>\n    <hostClusterType>online</hostClusterType>\n    <hostClusterRole>data</hostClusterRole>\n  </macros>\n</clickhouse>\n",
        "config.d/posthog_remote_servers.xml": "<clickhouse>\n  <remote_servers>\n    <posthog_single_shard>\n      <shard>\n        <replica>\n          <host>chi-posthog-posthog-0-0</host>\n          <port>9000</port>\n          <user>default</user>\n          <password from_env=\"CLICKHOUSE_PASSWORD\"/>\n        </replica>\n      </shard>\n    </posthog_single_shard>\n    <posthog_migrations>\n      <shard>\n        <replica>\n          <host>chi-posthog-posthog-0-0</host>\n          <port>9000</port>\n          <user>default</user>\n          <password from_env=\"CLICKHOUSE_PASSWORD\"/>\n        </replica>\n      </shard>\n    </posthog_migrations>\n    <posthog_writable>\n      <shard>\n        <replica>\n          <host>chi-posthog-posthog-0-0</host>\n          <port>9000</port>\n          <user>default</user>\n          <password from_env=\"CLICKHOUSE_PASSWORD\"/>\n        </replica>\n      </shard>\n    </posthog_writable>\n    <posthog_primary_replica>\n      <shard>\n        <replica>\n          <host>chi-posthog-posthog-0-0</host>\n          <port>9000</port>\n          <user>default</user>\n          <password from_env=\"CLICKHOUSE_PASSWORD\"/>\n        </replica>\n      </shard>\n    </posthog_primary_replica>\n    <ai_events>\n      <shard>\n        <replica>\n          <host>chi-posthog-posthog-0-0</host>\n          <port>9000</port>\n          <user>default</user>\n          <password from_env=\"CLICKHOUSE_PASSWORD\"/>\n        </replica>\n      </shard>\n    </ai_events>\n    <aux>\n      <shard>\n        <replica>\n          <host>chi-posthog-posthog-0-0</host>\n          <port>9000</port>\n          <user>default</user>\n          <password from_env=\"CLICKHOUSE_PASSWORD\"/>\n        </replica>\n      </shard>\n    </aux>\n    <ops>\n      <shard>\n        <replica>\n          <host>chi-posthog-posthog-0-0</host>\n          <port>9000</port>\n          <user>default</user>\n          <password from_env=\"CLICKHOUSE_PASSWORD\"/>\n        </replica>\n      </shard>\n    </ops>\n    <sessions>\n      <shard>\n        <replica>\n          <host>chi-posthog-posthog-0-0</host>\n          <port>9000</port>\n          <user>default</user>\n          <password from_env=\"CLICKHOUSE_PASSWORD\"/>\n        </replica>\n      </shard>\n    </sessions>\n    <logs>\n      <shard>\n        <replica>\n          <host>chi-posthog-posthog-0-0</host>\n          <port>9000</port>\n          <user>default</user>\n          <password from_env=\"CLICKHOUSE_PASSWORD\"/>\n        </replica>\n      </shard>\n    </logs>\n  </remote_servers>\n</clickhouse>\n",
        "config.d/posthog_system_logs.xml": "<clickhouse>\n  <crash_log>\n    <database>system</database>\n    <table>crash_log</table>\n    <flush_interval_milliseconds>1000</flush_interval_milliseconds>\n    <flush_on_crash>true</flush_on_crash>\n  </crash_log>\n  <error_log>\n    <database>system</database>\n    <table>error_log</table>\n    <flush_interval_milliseconds>1000</flush_interval_milliseconds>\n    <collect_interval_milliseconds>1000</collect_interval_milliseconds>\n  </error_log>\n  <metric_log>\n    <database>system</database>\n    <table>metric_log</table>\n    <flush_interval_milliseconds>7500</flush_interval_milliseconds>\n    <collect_interval_milliseconds>1000</collect_interval_milliseconds>\n  </metric_log>\n</clickhouse>\n"
      },
      "profiles": {
        "api/profile": "default",
        "app/profile": "default",
        "default/allow_experimental_window_functions": "1",
        "default/allow_nondeterministic_mutations": "1",
        "default/allow_suspicious_low_cardinality_types": "1",
        "default/async_insert": "0",
        "default/compatibility": "26.6",
        "default/distributed_product_mode": "global",
        "default/enable_materialized_cte": "1",
        "default/enable_parallel_replicas": "0",
        "default/insert_distributed_sync": "1",
        "default/load_balancing": "random",
        "default/max_memory_usage": "10000000000",
        "default/max_parallel_replicas": "1",
        "default/number_of_mutations_to_throw": "1",
        "default/optimize_empty_string_comparisons": "0",
        "default/optimize_rewrite_has_to_in": "0",
        "default/query_profiler_cpu_time_period_ns": "0",
        "default/query_profiler_real_time_period_ns": "0",
        "default/throw_on_max_partitions_per_insert_block": "false",
        "readonly/readonly": "1"
      },
      "quotas": {
        "default/interval/duration": "3600",
        "default/interval/errors": "0",
        "default/interval/execution_time": "0",
        "default/interval/queries": "0",
        "default/interval/read_rows": "0",
        "default/interval/result_rows": "0"
      },
      "settings": {
        "background_merges_mutations_concurrency_ratio": "8",
        "background_message_broker_schedule_pool_size": "128",
        "background_pool_size": "4",
        "builtin_dictionaries_reload_interval": "3600",
        "compiled_expression_cache_elements_size": "10000",
        "compiled_expression_cache_size": "134217728",
        "default_session_timeout": "60",
        "keep_alive_timeout": "3",
        "logger/count": "3",
        "logger/level": "warning",
        "logger/size": "100M",
        "mark_cache_size": "5368709120",
        "max_concurrent_queries": "200",
        "max_connections": "4096",
        "max_server_memory_usage_to_ram_ratio": "0.9",
        "max_session_timeout": "3600",
        "max_thread_pool_size": "10000",
        "merge_tree/max_bytes_to_merge_at_max_space_in_pool": "1073741824",
        "merge_tree/number_of_free_entries_in_pool_to_execute_mutation": "2",
        "merge_tree/number_of_free_entries_in_pool_to_execute_optimize_entire_partition": "2",
        "mmap_cache_size": "1000",
        "uncompressed_cache_size": "8589934592",
        "user_scripts_path": "/usr/local/share/posthog/user_scripts/"
      },
      "users": {
        "api/default_database": "posthog",
        "api/networks/ip": "::/0",
        "api/password": {
          "valueFrom": {
            "secretKeyRef": {
              "key": "password",
              "name": "posthog-clickhouse-password"
            }
          }
        },
        "api/profile": "api",
        "api/quota": "default",
        "app/default_database": "posthog",
        "app/networks/ip": "::/0",
        "app/password": {
          "valueFrom": {
            "secretKeyRef": {
              "key": "password",
              "name": "posthog-clickhouse-password"
            }
          }
        },
        "app/profile": "app",
        "app/quota": "default",
        "default/access_management": "1",
        "default/default_database": "posthog",
        "default/named_collection_control": "1",
        "default/networks/ip": "::/0",
        "default/password": {
          "valueFrom": {
            "secretKeyRef": {
              "key": "password",
              "name": "posthog-clickhouse-password"
            }
          }
        },
        "default/profile": "default",
        "default/quota": "default",
        "default/show_named_collections": "1",
        "default/show_named_collections_secrets": "1",
        "dict_reader/grants/query": [
          "GRANT SELECT ON default.*",
          "GRANT SELECT ON posthog.*",
          "GRANT SELECT ON posthog_test.*"
        ],
        "dict_reader/networks/ip": [
          "127.0.0.1",
          "::1"
        ],
        "dict_reader/password": {
          "valueFrom": {
            "secretKeyRef": {
              "key": "password",
              "name": "posthog-clickhouse-password"
            }
          }
        },
        "dict_reader/profile": "readonly",
        "dict_reader/quota": "default"
      },
      "zookeeper": {
        "nodes": [
          {
            "host": "chk-posthog-keeper-keeper-0-0",
            "port": 2181
          }
        ]
      }
    },
    "defaults": {
      "templates": {
        "dataVolumeClaimTemplate": "data",
        "podTemplate": "clickhouse"
      }
    },
    "templates": {
      "podTemplates": [
        {
          "name": "clickhouse",
          "spec": {
            "containers": [
              {
                "env": [
                  {
                    "name": "KAFKA_HOSTS",
                    "value": "posthog-redpanda.posthog.svc.cluster.local:9093"
                  },
                  {
                    "name": "CLICKHOUSE_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "key": "password",
                        "name": "posthog-clickhouse-password"
                      }
                    }
                  }
                ],
                "image": "registry.streamloop.app/ghcr.io/blitss/posthog-clickhouse:26.6.2.158@sha256:be4787940c45b37a220bd67a067fc4a524e3a06da47c21bba083185605aaa8ba",
                "imagePullPolicy": "Always",
                "name": "clickhouse",
                "resources": {
                  "limits": {
                    "cpu": "2",
                    "memory": "8Gi"
                  },
                  "requests": {
                    "cpu": "1",
                    "memory": "4Gi"
                  }
                },
                "volumeMounts": [
                  {
                    "mountPath": "/docker-entrypoint-initdb.d",
                    "name": "initdb"
                  }
                ]
              }
            ],
            "volumes": [
              {
                "configMap": {
                  "name": "posthog-clickhouse-initdb"
                },
                "name": "initdb"
              }
            ]
          }
        }
      ],
      "volumeClaimTemplates": [
        {
          "name": "data",
          "spec": {
            "accessModes": [
              "ReadWriteOnce"
            ],
            "resources": {
              "requests": {
                "storage": "50Gi"
              }
            }
          }
        }
      ]
    }
  },
  "metadata": {
    "name": "posthog",
    "namespace": "posthog"
  }
}
