apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
spec:
  chartRef:
    kind: OCIRepository
    name: posthog-chart
  dependsOn:
    - name: clickhouse-operator
  install:
    disableWait: true
    remediation:
      retries: 0
      remediateLastFailure: false
  interval: 5m
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              - op: replace
                path: /spec/template/spec/containers/0/startupProbe/httpGet/path
                value: /preflight
              - op: replace
                path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
                value: /preflight
              - op: replace
                path: /spec/template/spec/containers/0/livenessProbe/httpGet/path
                value: /preflight
            target:
              group: apps
              kind: Deployment
              name: posthog-web
              version: v1
          - patch: |
              - op: add
                path: /spec/routes/8
                value:
                  kind: Rule
                  match: Host(`posthog.streamloop.app`) && PathPrefix(`/static/`)
                  priority: 2
                  middlewares:
                    - name: posthog-static-cache
                    - name: posthog-static-compress
                  services:
                    - name: posthog-web
                      port: 8000
            target:
              group: traefik.io
              kind: IngressRoute
              name: posthog
              version: v1alpha1
  timeout: 45m
  upgrade:
    disableWait: true
    remediation:
      remediateLastFailure: false
      retries: 0
  values:
    asyncMigrationsCheck:
      image:
        pullPolicy: IfNotPresent
        repository: registry.streamloop.app/ghcr.io/blitss/posthog-migrate
        tag: latest@sha256:6054548223af8e38c474f77d84e4a16deb9182237f2fc400cce15ff30995ff6a
    browserless:
      enabled: true
      image:
        repository: ghcr.io/browserless/chromium
        tag: v2.51.2@sha256:79a37927bdd235c8f5a299a8846c37e946c3505dff2562ece3922d4562d016a3
    capture:
      image:
        repository: registry.streamloop.app/ghcr.io/posthog/posthog/capture
        tag: master@sha256:f60d30b33e2dd7cc1a0613762781f0832440d6ff6cfb7c4b28b30de497fe0c46
    captureAi:
      image:
        repository: registry.streamloop.app/ghcr.io/posthog/posthog/capture
        tag: master@sha256:f60d30b33e2dd7cc1a0613762781f0832440d6ff6cfb7c4b28b30de497fe0c46
    captureLogs:
      image:
        repository: registry.streamloop.app/ghcr.io/posthog/posthog/capture-logs
        tag: master@sha256:4ce27fb3d875838ac4ebc287ed65b4b7226d7924e16f561c1067deff79a22e57
      extraEnv:
        - name: CLICKHOUSE_LOGS_DATABASE
          value: posthog
    cdpCyclotronV2Janitor:
      enabled: true
    cdpHogflowScheduler:
      enabled: true
    clickhouse:
      database: posthog
      enabled: false
    cyclotronMigrate:
      enabled: true
      image:
        pullPolicy: IfNotPresent
        repository: registry.streamloop.app/ghcr.io/blitss/posthog-cyclotron-migrate
        tag: latest@sha256:820db5701bd4fe5e888f3710c2343558bb137c539a05d27918b958fd135e6931
    cymbal:
      image:
        repository: registry.streamloop.app/ghcr.io/posthog/posthog/cymbal
        tag: master@sha256:a557def255e9b736542ddaa6b9b03f36a6d3dda03e83cc3e02085733826c39b9
    cymbalResolution:
      enabled: true
    elasticsearch:
      enabled: false
    externalClickhouse:
      apiUser: api
      appUser: app
      cluster: posthog
      dictReaderUser: dict_reader
      host: clickhouse-posthog.posthog.svc.cluster.local
      logsCluster: posthog
      migrationsCluster: posthog
      primaryReplicaCluster: posthog
      secretName: posthog-clickhouse-password
      secretPasswordKey: password
      singleShardCluster: posthog
      user: default
      writableCluster: posthog
    externalElasticsearch:
      host: posthog-elastic-es-http.posthog.svc.cluster.local
      passwordKey: elastic
      scheme: http
      secretName: posthog-elastic-es-elastic-user
      user: elastic
      version: v8
    externalKafka:
      brokers: posthog-redpanda.posthog.svc.cluster.local:9093
    externalObjectStorage:
      endpoint: https://f7bb26785c99f3c0603872623fa23bdf.r2.cloudflarestorage.com
    externalPostgresql:
      database: posthog
      host: posthog-pg-rw
      passwordKey: password
      personsDatabase: posthog
      port: 5432
      secretName: posthog-pg-app
      usernameKey: username
    externalSeaweedfs:
      endpoint: https://f7bb26785c99f3c0603872623fa23bdf.r2.cloudflarestorage.com
    featureFlags:
      image:
        repository: registry.streamloop.app/ghcr.io/posthog/posthog/feature-flags
        tag: master@sha256:f8d1b540fc7c2e8aa9d24e5d619c07a7187d715363fd11ffeb64d552f7f52df3
    geoip:
      brotli: false
      downloadUrl: https://r2.streamloop.app/GeoIP2-City.mmdb
      enabled: true
      image: alpine:3.23@sha256:469c9ea410b9215eaee7976ba6c0639039b444be8e5d638f7abbada189971eb2
    global:
      containerSecurityContext: {}
      podSecurityContext: {}
    hypercacheServer:
      image:
        repository: ghcr.io/posthog/posthog/hypercache-server
        tag: master@sha256:57320a9a91c92eda423c3413cbab3d934927db7f1a3d53a8c8974b01b91fc83d
    ingress:
      enabled: true
      gateway:
        enabled: false
      hostname: posthog.streamloop.app
      nginx:
        enabled: false
      traefik:
        enabled: true
        entryPoints:
          - websecure
        tls:
          enabled: true
          secretName: posthog-tls
    kafka:
      enabled: false
    livestream:
      enabled: true
      image:
        repository: registry.streamloop.app/ghcr.io/posthog/posthog/livestream
        tag: master@sha256:9be2f074b41eb7b2e403ed1681677663ebb54503b2c410a5f0f4c69ffb81d35d
    mcp:
      enabled: true
      image:
        pullPolicy: Always
        repository: registry.streamloop.app/ghcr.io/posthog/posthog-mcp
        tag: latest@sha256:355ec16ec26b57829b270cbad2c12857ad2ef3a5414b772fcafb588e07eea7ad
    migrate:
      image:
        pullPolicy: IfNotPresent
        repository: registry.streamloop.app/ghcr.io/blitss/posthog-migrate
        tag: latest@sha256:6054548223af8e38c474f77d84e4a16deb9182237f2fc400cce15ff30995ff6a
      persons:
        enabled: true
        skipPartitioning: true
    minio:
      enabled: false
    networkPolicies:
      enabled: false
    objectStorage:
      aiBlobs:
        bucket: posthog
        offloadTeams: '*'
        prefix: ai-blobs/aio/
      enabled: true
    personhog:
      addr: posthog-personhog-router:50052
      enabled: true
    personhogReplica:
      enabled: true
      image:
        repository: registry.streamloop.app/ghcr.io/posthog/posthog/personhog-replica
        tag: master@sha256:ce5c7429c73608a9d8538fbba7c4500ea50d30e7e9d77943ae6f93b9b59532a2
    personhogRouter:
      enabled: true
      image:
        repository: registry.streamloop.app/ghcr.io/posthog/posthog/personhog-router
        tag: master@sha256:f2a8d850f0a045889671eec297e0aa0df3657ecfa5fe89cb33cf4a8ad1f8b87d
    plugins:
      image:
        repository: registry.streamloop.app/ghcr.io/posthog/posthog-node
        tag: master@sha256:7b3d64a9a1bdcdb48dd3c824360fb74d758c8f4c3498077600cedf0536523971
    postgresql:
      enabled: false
    posthog:
      env:
        MULTI_ORG_ENABLED: "1"
      image:
        pullPolicy: IfNotPresent
        repository: registry.streamloop.app/ghcr.io/blitss/posthog-web
        tag: latest@sha256:40ec356993db6b165dc107a10217163bd0bfd805001aef4ebd297cc9fec3c7e3
      optOutCapture: true
      secretEnv:
        OIDC_RSA_PRIVATE_KEY:
          key: tls.key
          name: posthog-oidc-generated
    propertyDefsRs:
      image:
        repository: registry.streamloop.app/ghcr.io/posthog/posthog/property-defs-rs
        tag: master@sha256:52fadc10e79f9b13a2aa04751ace61bd04072ace99e94fea77d32ddf226afdd0
    redis:
      enabled: true
      image:
        repository: redis
        tag: 7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    replayCapture:
      image:
        repository: registry.streamloop.app/ghcr.io/posthog/posthog/capture
        tag: master@sha256:f60d30b33e2dd7cc1a0613762781f0832440d6ff6cfb7c4b28b30de497fe0c46
    rustfs:
      enabled: false
    seaweedfs:
      enabled: false
    temporal:
      adminTools:
        image:
          repository: registry.streamloop.app/docker.io/temporalio/admin-tools
          tag: 1.31.0@sha256:3e68adcd54195a7c1222e99f2dbc32a4fdbf44ad69e3bb48e21e85c4bf417c2e
      enabled: true
      server:
        image:
          repository: registry.streamloop.app/docker.io/temporalio/auto-setup
          tag: 1.29.6@sha256:1263120feed69d82e4ca23b8ca6f1d702c3029fe70714e382966d0192318eab6
      ui:
        image:
          repository: registry.streamloop.app/docker.io/temporalio/ui
          tag: 2.50.0@sha256:49a61456f6b770af926d6d7d74f63ebb4b9a3c5abc4fb68ddb146321d49391e4
    temporalDjangoWorker:
      image:
        pullPolicy: IfNotPresent
        repository: registry.streamloop.app/ghcr.io/blitss/posthog-worker
        tag: latest@sha256:e2b18b0c01cba771df226c954299f8119cf5e3204ee08e8f643e4a0d65dd17d0
      resources:
        limits:
          memory: 6Gi
        requests:
          cpu: 500m
          memory: 1Gi
    valkey:
      enabled: true
      image:
        repository: valkey/valkey
        tag: 8.1-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
    web:
      enabled: true
      image:
        pullPolicy: IfNotPresent
        repository: registry.streamloop.app/ghcr.io/blitss/posthog-web
        tag: latest@sha256:40ec356993db6b165dc107a10217163bd0bfd805001aef4ebd297cc9fec3c7e3
      replicas: 1
      resources:
        limits:
          memory: 8Gi
        requests:
          cpu: 500m
          memory: 2Gi
    worker:
      extraEnv:
        - name: CELERY_WORKER_CONCURRENCY
          value: "2"
      image:
        pullPolicy: IfNotPresent
        repository: registry.streamloop.app/ghcr.io/blitss/posthog-worker
        tag: latest@sha256:e2b18b0c01cba771df226c954299f8119cf5e3204ee08e8f643e4a0d65dd17d0
      resources:
        limits:
          memory: 8Gi
        requests:
          cpu: 500m
          memory: 1Gi
    workerBeat:
      enabled: true
      image:
        pullPolicy: IfNotPresent
        repository: registry.streamloop.app/ghcr.io/blitss/posthog-worker
        tag: latest@sha256:e2b18b0c01cba771df226c954299f8119cf5e3204ee08e8f643e4a0d65dd17d0
      replicas: 1
      resources:
        limits:
          memory: 6Gi
        requests:
          cpu: 100m
          memory: 512Mi
    workerExports:
      enabled: true
      image:
        pullPolicy: IfNotPresent
        repository: registry.streamloop.app/ghcr.io/blitss/posthog-worker-exports
        tag: latest@sha256:05732ee4ef24b02d868627bf939d92dccbcfbe4f0f56a2593e719482c40b31d9
    zookeeper:
      enabled: false
  valuesFrom:
    - kind: Secret
      name: posthog-secrets
      valuesKey: object-storage-access-key
      targetPath: externalObjectStorage.accessKey
    - kind: Secret
      name: posthog-secrets
      valuesKey: object-storage-secret-key
      targetPath: externalObjectStorage.secretKey
    - kind: Secret
      name: posthog-secrets
      valuesKey: seaweedfs-access-key
      targetPath: externalSeaweedfs.accessKey
    - kind: Secret
      name: posthog-secrets
      valuesKey: seaweedfs-secret-key
      targetPath: externalSeaweedfs.secretKey
metadata:
  name: posthog
  namespace: posthog
