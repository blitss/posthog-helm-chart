apiVersion: v1
kind: ConfigMap
metadata:
  name: posthog-clickhouse-initdb
  namespace: posthog
data:
  01_init_posthog.sh: |
    #!/bin/bash
    set -e

    echo "Creating posthog database..."
    clickhouse client --database system --password "${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}" -n <<-'EOSQL'
      CREATE DATABASE IF NOT EXISTS posthog;
    EOSQL

    # Kafka-engine named collections that PostHog ClickHouse migrations reference
    # (e.g. ENGINE = Kafka(warpstream_cyclotron, ...) for kafka_hog_invocation_results).
    # These MUST be SQL-created (not in the CHI named_collections.xml): once a
    # table uses one, ClickHouse refuses to drop it (NAMED_COLLECTION_IS_USED)
    # and rejects startup if the same name is in both XML and SQL. Creating them
    # here at init — before the migrate hook builds the Kafka tables — makes a
    # fresh ClickHouse reproduce the full set instead of relying on ad-hoc SQL.
    # (msk_cluster / warpstream_ingestion stay in named_collections.xml.)
    echo "Creating Kafka named collections..."
    clickhouse client --database system --password "${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}" -n <<-'EOSQL'
      CREATE NAMED COLLECTION IF NOT EXISTS warpstream_shared AS kafka_broker_list = 'posthog-redpanda.posthog.svc.cluster.local:9093';
      CREATE NAMED COLLECTION IF NOT EXISTS warpstream_calculated_events AS kafka_broker_list = 'posthog-redpanda.posthog.svc.cluster.local:9093';
      CREATE NAMED COLLECTION IF NOT EXISTS warpstream_replay AS kafka_broker_list = 'posthog-redpanda.posthog.svc.cluster.local:9093';
      CREATE NAMED COLLECTION IF NOT EXISTS warpstream_cyclotron AS kafka_broker_list = 'posthog-redpanda.posthog.svc.cluster.local:9093';
      CREATE NAMED COLLECTION IF NOT EXISTS warpstream_logs AS kafka_broker_list = 'posthog-redpanda.posthog.svc.cluster.local:9093';
      CREATE NAMED COLLECTION IF NOT EXISTS warpstream_traces AS kafka_broker_list = 'posthog-redpanda.posthog.svc.cluster.local:9093';
      CREATE NAMED COLLECTION IF NOT EXISTS warpstream_metrics AS kafka_broker_list = 'posthog-redpanda.posthog.svc.cluster.local:9093';
    EOSQL

    echo "Flushing logs to create system log tables..."
    clickhouse client --database system --password "${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}" --query "SYSTEM FLUSH LOGS"

    echo "Waiting for system log tables..."
    for i in $(seq 1 30); do
      COUNT=$(clickhouse client --database system --password "${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}" --query "
        SELECT count()
        FROM system.tables
        WHERE database = 'system'
          AND name IN ('crash_log', 'error_log', 'metric_log')
      ")
      if [ "$COUNT" = "3" ]; then
        echo "System log tables ready"
        exit 0
      fi
      echo "  $COUNT/3 tables ready, retrying in 2s..."
      sleep 2
    done

    echo "Timed out waiting for system log tables" >&2
    exit 1
---
apiVersion: clickhouse-keeper.altinity.com/v1
kind: ClickHouseKeeperInstallation
spec:
  configuration:
    clusters:
      - layout:
          replicasCount: 1
        name: keeper
  defaults:
    templates:
      podTemplate: keeper
      volumeClaimTemplate: keeper-data
  templates:
    podTemplates:
      - name: keeper
        spec:
          containers:
            - image: altinity/clickhouse-keeper:25.3.6.10034.altinitystable@sha256:7d44b89b1b73be004ededa43fb7a5f71e8191a6c4c53232de249ed8bb208ba0d
              name: clickhouse-keeper
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 256Mi
    volumeClaimTemplates:
      - name: keeper-data
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
metadata:
  name: posthog-keeper
  namespace: posthog
---
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
spec:
  configuration:
    clusters:
      - layout:
          replicasCount: 1
          shardsCount: 1
        name: posthog
        secret:
          auto: "true"
    files:
      config.d/named_collections.xml: |
        <clickhouse>
          <named_collections>
            <msk_cluster>
              <kafka_broker_list from_env="KAFKA_HOSTS"/>
            </msk_cluster>
            <warpstream_ingestion>
              <kafka_broker_list from_env="KAFKA_HOSTS"/>
            </warpstream_ingestion>
            <!--
              warpstream_calculated_events / warpstream_replay / warpstream_shared
              are created at runtime via CREATE NAMED COLLECTION (persisted to
              /var/lib/clickhouse/named_collections/*.sql). They cannot also be
              defined here — CH 25.x rejects startup if SQL- and XML-defined
              named collections overlap by name (NAMED_COLLECTION_ALREADY_EXISTS).
            -->
          </named_collections>
        </clickhouse>
      config.d/posthog_macros.xml: |
        <clickhouse>
          <macros>
            <hostClusterType>online</hostClusterType>
            <hostClusterRole>data</hostClusterRole>
          </macros>
        </clickhouse>
      config.d/posthog_remote_servers.xml: |
        <clickhouse>
          <remote_servers>
            <posthog_single_shard>
              <shard>
                <replica>
                  <host>chi-posthog-posthog-0-0</host>
                  <port>9000</port>
                  <user>default</user>
                  <password from_env="CLICKHOUSE_PASSWORD"/>
                </replica>
              </shard>
            </posthog_single_shard>
            <posthog_migrations>
              <shard>
                <replica>
                  <host>chi-posthog-posthog-0-0</host>
                  <port>9000</port>
                  <user>default</user>
                  <password from_env="CLICKHOUSE_PASSWORD"/>
                </replica>
              </shard>
            </posthog_migrations>
            <posthog_writable>
              <shard>
                <replica>
                  <host>chi-posthog-posthog-0-0</host>
                  <port>9000</port>
                  <user>default</user>
                  <password from_env="CLICKHOUSE_PASSWORD"/>
                </replica>
              </shard>
            </posthog_writable>
            <posthog_primary_replica>
              <shard>
                <replica>
                  <host>chi-posthog-posthog-0-0</host>
                  <port>9000</port>
                  <user>default</user>
                  <password from_env="CLICKHOUSE_PASSWORD"/>
                </replica>
              </shard>
            </posthog_primary_replica>
            <ai_events>
              <shard>
                <replica>
                  <host>chi-posthog-posthog-0-0</host>
                  <port>9000</port>
                  <user>default</user>
                  <password from_env="CLICKHOUSE_PASSWORD"/>
                </replica>
              </shard>
            </ai_events>
            <aux>
              <shard>
                <replica>
                  <host>chi-posthog-posthog-0-0</host>
                  <port>9000</port>
                  <user>default</user>
                  <password from_env="CLICKHOUSE_PASSWORD"/>
                </replica>
              </shard>
            </aux>
            <ops>
              <shard>
                <replica>
                  <host>chi-posthog-posthog-0-0</host>
                  <port>9000</port>
                  <user>default</user>
                  <password from_env="CLICKHOUSE_PASSWORD"/>
                </replica>
              </shard>
            </ops>
            <sessions>
              <shard>
                <replica>
                  <host>chi-posthog-posthog-0-0</host>
                  <port>9000</port>
                  <user>default</user>
                  <password from_env="CLICKHOUSE_PASSWORD"/>
                </replica>
              </shard>
            </sessions>
            <logs>
              <shard>
                <replica>
                  <host>chi-posthog-posthog-0-0</host>
                  <port>9000</port>
                  <user>default</user>
                  <password from_env="CLICKHOUSE_PASSWORD"/>
                </replica>
              </shard>
            </logs>
          </remote_servers>
        </clickhouse>
      config.d/posthog_system_logs.xml: |
        <clickhouse>
          <crash_log>
            <database>system</database>
            <table>crash_log</table>
            <flush_interval_milliseconds>1000</flush_interval_milliseconds>
            <flush_on_crash>true</flush_on_crash>
          </crash_log>
          <error_log>
            <database>system</database>
            <table>error_log</table>
            <flush_interval_milliseconds>1000</flush_interval_milliseconds>
            <collect_interval_milliseconds>1000</collect_interval_milliseconds>
          </error_log>
          <metric_log>
            <database>system</database>
            <table>metric_log</table>
            <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            <collect_interval_milliseconds>1000</collect_interval_milliseconds>
          </metric_log>
        </clickhouse>
    profiles:
      api/profile: default
      app/profile: default
      default/allow_experimental_window_functions: "1"
      default/allow_nondeterministic_mutations: "1"
      default/allow_suspicious_low_cardinality_types: "1"
      default/async_insert: "0"
      default/compatibility: "26.6"
      default/distributed_product_mode: global
      default/enable_materialized_cte: "1"
      default/enable_parallel_replicas: "0"
      default/insert_distributed_sync: "1"
      default/load_balancing: random
      default/max_memory_usage: "10000000000"
      default/max_parallel_replicas: "1"
      default/number_of_mutations_to_throw: "1"
      default/optimize_empty_string_comparisons: "0"
      default/optimize_rewrite_has_to_in: "0"
      default/query_profiler_cpu_time_period_ns: "0"
      default/query_profiler_real_time_period_ns: "0"
      default/throw_on_max_partitions_per_insert_block: "false"
      readonly/readonly: "1"
    quotas:
      default/interval/duration: "3600"
      default/interval/errors: "0"
      default/interval/execution_time: "0"
      default/interval/queries: "0"
      default/interval/read_rows: "0"
      default/interval/result_rows: "0"
    settings:
      background_merges_mutations_concurrency_ratio: "8"
      background_message_broker_schedule_pool_size: "128"
      background_pool_size: "4"
      builtin_dictionaries_reload_interval: "3600"
      compiled_expression_cache_elements_size: "10000"
      compiled_expression_cache_size: "134217728"
      default_session_timeout: "60"
      keep_alive_timeout: "3"
      logger/count: "3"
      logger/level: warning
      logger/size: 100M
      mark_cache_size: "5368709120"
      max_concurrent_queries: "200"
      max_connections: "4096"
      max_server_memory_usage_to_ram_ratio: "0.9"
      max_session_timeout: "3600"
      max_thread_pool_size: "10000"
      merge_tree/max_bytes_to_merge_at_max_space_in_pool: "1073741824"
      merge_tree/number_of_free_entries_in_pool_to_execute_mutation: "2"
      merge_tree/number_of_free_entries_in_pool_to_execute_optimize_entire_partition: "2"
      mmap_cache_size: "1000"
      uncompressed_cache_size: "8589934592"
      user_scripts_path: /usr/local/share/posthog/user_scripts/
    users:
      api/default_database: posthog
      api/networks/ip: ::/0
      api/password:
        valueFrom:
          secretKeyRef:
            key: password
            name: posthog-clickhouse-password
      api/profile: api
      api/quota: default
      app/default_database: posthog
      app/networks/ip: ::/0
      app/password:
        valueFrom:
          secretKeyRef:
            key: password
            name: posthog-clickhouse-password
      app/profile: app
      app/quota: default
      default/access_management: "1"
      default/default_database: posthog
      default/named_collection_control: "1"
      default/networks/ip: ::/0
      default/password:
        valueFrom:
          secretKeyRef:
            key: password
            name: posthog-clickhouse-password
      default/profile: default
      default/quota: default
      default/show_named_collections: "1"
      default/show_named_collections_secrets: "1"
      dict_reader/grants/query:
        - GRANT SELECT ON default.*
        - GRANT SELECT ON posthog.*
        - GRANT SELECT ON posthog_test.*
      dict_reader/networks/ip:
        - 127.0.0.1
        - ::1
      dict_reader/password:
        valueFrom:
          secretKeyRef:
            key: password
            name: posthog-clickhouse-password
      dict_reader/profile: readonly
      dict_reader/quota: default
    zookeeper:
      nodes:
        - host: chk-posthog-keeper-keeper-0-0
          port: 2181
  defaults:
    templates:
      dataVolumeClaimTemplate: data
      podTemplate: clickhouse
  templates:
    podTemplates:
      - name: clickhouse
        spec:
          containers:
            - env:
                - name: KAFKA_HOSTS
                  value: posthog-redpanda.posthog.svc.cluster.local:9093
                - name: CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: posthog-clickhouse-password
              image: registry.streamloop.app/ghcr.io/blitss/posthog-clickhouse:26.6.2.158@sha256:be4787940c45b37a220bd67a067fc4a524e3a06da47c21bba083185605aaa8ba
              imagePullPolicy: Always
              name: clickhouse
              resources:
                limits:
                  cpu: "2"
                  memory: 8Gi
                requests:
                  cpu: "1"
                  memory: 4Gi
              volumeMounts:
                - mountPath: /docker-entrypoint-initdb.d
                  name: initdb
          volumes:
            - configMap:
                name: posthog-clickhouse-initdb
              name: initdb
    volumeClaimTemplates:
      - name: data
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
metadata:
  name: posthog
  namespace: posthog
---
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
spec:
  version: 8.17.3
  image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3@sha256:224c75e346bd745ce908f06a1cbad7bf10988961dcdcdfccb22556b3f856b3f0
  nodeSets:
    - config:
        node.store.allow_mmap: false
      count: 1
      name: default
      podTemplate:
        spec:
          containers:
            - env:
                - name: ES_JAVA_OPTS
                  value: -Xms1g -Xmx1g
              name: elasticsearch
              resources:
                limits:
                  cpu: 1
                  memory: 2Gi
                requests:
                  cpu: 250m
                  memory: 2Gi
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
  http:
    tls:
      selfSignedCertificate:
        disabled: true
metadata:
  name: posthog-elastic
  namespace: posthog
---
apiVersion: cert-manager.io/v1
kind: Issuer
spec:
  selfSigned: {}
metadata:
  name: selfsigned
  namespace: posthog
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - issuer.yaml
  - oidc-certificate.yaml
  - tls-certificate.yaml
  - postgres-cnpg.yaml
  - clickhouse-keeper.yaml
  - clickhouse-initdb.yaml
  - clickhouse.yaml
  - elasticsearch.yaml
  - redpanda.yaml
  - posthog-static-cache.yaml
  - posthog-static-compress.yaml
  - ocirepository.yaml
  - release.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: posthog
  labels:
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
spec:
  interval: 30m
  ref:
    digest: sha256:d65943cdce3d349375dab1f485ac1f563bc1ed108f33f4ffe63301f926bdd434
  url: oci://registry.streamloop.app/ghcr.io/blitss/charts/posthog
metadata:
  name: posthog-chart
  namespace: posthog
  annotations:
    posthog.streamloop.app/chart-version: 0.22.4
---
apiVersion: cert-manager.io/v1
kind: Certificate
spec:
  commonName: posthog-oidc
  dnsNames:
    - posthog-oidc.local
  issuerRef:
    kind: Issuer
    name: selfsigned
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 4096
  secretName: posthog-oidc-generated
metadata:
  name: posthog-oidc-keypair
  namespace: posthog
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
spec:
  instances: 1
  enableSuperuserAccess: true
  imageName: registry.streamloop.app/ghcr.io/cloudnative-pg/postgresql:16@sha256:a93b1974ead1779795ea6a17dccd4acbffed1464172f84d79c2010d3e80722d3
  bootstrap:
    initdb:
      database: posthog
      owner: posthog
      postInitApplicationSQL:
        - ALTER ROLE posthog CREATEDB;
        - CREATE DATABASE cyclotron OWNER posthog;
        - CREATE DATABASE cyclotron_node OWNER posthog;
        - CREATE DATABASE posthog_persons OWNER posthog;
        - CREATE DATABASE behavioral_cohorts OWNER posthog;
        - CREATE DATABASE ducklake OWNER posthog;
        - CREATE DATABASE temporal OWNER posthog;
        - CREATE DATABASE temporal_visibility OWNER posthog;
  storage:
    size: 20Gi
  resources: {}
metadata:
  name: posthog-pg
  namespace: posthog
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
spec:
  headers:
    customResponseHeaders:
      Cache-Control: public, max-age=31536000, immutable
metadata:
  name: posthog-static-cache
  namespace: posthog
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
spec:
  compress: {}
metadata:
  name: posthog-static-compress
  namespace: posthog
---
apiVersion: cluster.redpanda.com/v1alpha2
kind: Redpanda
spec:
  chartRef: {}
  clusterSpec:
    auth:
      sasl:
        enabled: false
    config:
      cluster:
        auto_create_topics_enabled: true
        default_topic_partitions: 1
        default_topic_replications: 1
      tunable:
        group_topic_partitions: 1
    connectors:
      enabled: false
    console:
      enabled: false
    external:
      enabled: false
    image:
      tag: v26.1.1
    listeners:
      admin:
        port: 9644
        tls:
          enabled: false
      http:
        enabled: false
      kafka:
        port: 9093
        tls:
          enabled: false
      rpc:
        port: 33145
        tls:
          enabled: false
      schemaRegistry:
        enabled: false
    resources:
      cpu:
        cores: 1
      memory:
        container:
          max: 2Gi
    statefulset:
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: redpanda
              image: docker.redpanda.com/redpandadata/redpanda:v26.1.1@sha256:e0efb480a5056f5df535e8978790840d4c18458e99934aa38b99ac89baf17f74
            - name: sidecar
              image: docker.redpanda.com/redpandadata/redpanda-operator:v26.1.2@sha256:d5d1d9a5629d3e1a4bd8fe4b1120407074ad8fec83f075ad9b825364b6d9be25
    storage:
      persistentVolume:
        enabled: true
        size: 20Gi
    tls:
      enabled: false
metadata:
  name: posthog-redpanda
  namespace: posthog
  annotations:
    operator.redpanda.com/config-sync-mode: additive
    operator.redpanda.com/restart-cluster-on-config-change: "false"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
spec:
  chartRef:
    kind: OCIRepository
    name: posthog-chart
  dependsOn:
    - name: clickhouse-operator
  install:
    disableWait: true
    remediation:
      retries: 0
      remediateLastFailure: false
  interval: 5m
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              - op: replace
                path: /spec/template/spec/containers/0/startupProbe/httpGet/path
                value: /preflight
              - op: replace
                path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
                value: /preflight
              - op: replace
                path: /spec/template/spec/containers/0/livenessProbe/httpGet/path
                value: /preflight
            target:
              group: apps
              kind: Deployment
              name: posthog-web
              version: v1
          - patch: |
              - op: add
                path: /spec/routes/8
                value:
                  kind: Rule
                  match: Host(`posthog.streamloop.app`) && PathPrefix(`/static/`)
                  priority: 2
                  middlewares:
                    - name: posthog-static-cache
                    - name: posthog-static-compress
                  services:
                    - name: posthog-web
                      port: 8000
            target:
              group: traefik.io
              kind: IngressRoute
              name: posthog
              version: v1alpha1
  timeout: 45m
  upgrade:
    disableWait: true
    remediation:
      remediateLastFailure: false
      retries: 0
  values:
    asyncMigrationsCheck:
      image:
        pullPolicy: IfNotPresent
        repository: registry.streamloop.app/ghcr.io/blitss/posthog-migrate
        tag: latest@sha256:0b6748c87594c061b20c7e2e263a746d4e0c25aa8b233fd695eeb0a378f94732
    browserless:
      enabled: true
      image:
        repository: ghcr.io/browserless/chromium
        tag: v2.51.2@sha256:79a37927bdd235c8f5a299a8846c37e946c3505dff2562ece3922d4562d016a3
    capture:
      image:
        repository: registry.streamloop.app/ghcr.io/posthog/posthog/capture
        tag: master@sha256:e2e26097e9173552595bb38c6550081dc0ce6244a2585795ec0aa2b3431a61f4
    captureAi:
      image:
        repository: registry.streamloop.app/ghcr.io/posthog/posthog/capture
        tag: master@sha256:e2e26097e9173552595bb38c6550081dc0ce6244a2585795ec0aa2b3431a61f4
    captureLogs:
      image:
        repository: registry.streamloop.app/ghcr.io/posthog/posthog/capture-logs
        tag: master@sha256:e8ebc718503c27230403601b1036a7db106d347eccf0ee2714b4c0e245e033fa
    cdpCyclotronV2Janitor:
      enabled: true
    cdpHogflowScheduler:
      enabled: true
    clickhouse:
      database: posthog
      enabled: false
    cyclotronMigrate:
      enabled: true
      image:
        pullPolicy: IfNotPresent
        repository: registry.streamloop.app/ghcr.io/blitss/posthog-cyclotron-migrate
        tag: latest@sha256:ac726ab397f131d530cd22c8d8addc5854e6942f780d6479f89ea9c3797193c5
    cymbal:
      image:
        repository: registry.streamloop.app/ghcr.io/posthog/posthog/cymbal
        tag: master@sha256:939d140ae9632eabce36286edacab9aa38bba34ce9e8818856b876f08e3671a9
    cymbalResolution:
      enabled: true
    elasticsearch:
      enabled: false
    externalClickhouse:
      apiUser: api
      appUser: app
      cluster: posthog
      dictReaderUser: dict_reader
      host: clickhouse-posthog.posthog.svc.cluster.local
      logsCluster: posthog
      migrationsCluster: posthog
      primaryReplicaCluster: posthog
      secretName: posthog-clickhouse-password
      secretPasswordKey: password
      singleShardCluster: posthog
      user: default
      writableCluster: posthog
    externalElasticsearch:
      host: posthog-elastic-es-http.posthog.svc.cluster.local
      passwordKey: elastic
      scheme: http
      secretName: posthog-elastic-es-elastic-user
      user: elastic
      version: v8
    externalKafka:
      brokers: posthog-redpanda.posthog.svc.cluster.local:9093
    externalObjectStorage:
      endpoint: https://f7bb26785c99f3c0603872623fa23bdf.r2.cloudflarestorage.com
    externalPostgresql:
      database: posthog
