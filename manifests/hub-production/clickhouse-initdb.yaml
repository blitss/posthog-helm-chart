{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "posthog-clickhouse-initdb",
    "namespace": "posthog"
  },
  "data": {
    "01_init_posthog.sh": "#!/bin/bash\nset -e\n\necho \"Creating posthog database...\"\nclickhouse client --database system --password \"${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}\" -n <<-'EOSQL'\n  CREATE DATABASE IF NOT EXISTS posthog;\nEOSQL\n\n# Kafka-engine named collections that PostHog ClickHouse migrations reference\n# (e.g. ENGINE = Kafka(warpstream_cyclotron, ...) for kafka_hog_invocation_results).\n# These MUST be SQL-created (not in the CHI named_collections.xml): once a\n# table uses one, ClickHouse refuses to drop it (NAMED_COLLECTION_IS_USED)\n# and rejects startup if the same name is in both XML and SQL. Creating them\n# here at init \u2014 before the migrate hook builds the Kafka tables \u2014 makes a\n# fresh ClickHouse reproduce the full set instead of relying on ad-hoc SQL.\n# (msk_cluster / warpstream_ingestion stay in named_collections.xml.)\necho \"Creating Kafka named collections...\"\nclickhouse client --database system --password \"${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}\" -n <<-'EOSQL'\n  CREATE NAMED COLLECTION IF NOT EXISTS warpstream_shared AS kafka_broker_list = 'posthog-redpanda.posthog.svc.cluster.local:9093';\n  CREATE NAMED COLLECTION IF NOT EXISTS warpstream_calculated_events AS kafka_broker_list = 'posthog-redpanda.posthog.svc.cluster.local:9093';\n  CREATE NAMED COLLECTION IF NOT EXISTS warpstream_replay AS kafka_broker_list = 'posthog-redpanda.posthog.svc.cluster.local:9093';\n  CREATE NAMED COLLECTION IF NOT EXISTS warpstream_cyclotron AS kafka_broker_list = 'posthog-redpanda.posthog.svc.cluster.local:9093';\n  CREATE NAMED COLLECTION IF NOT EXISTS warpstream_logs AS kafka_broker_list = 'posthog-redpanda.posthog.svc.cluster.local:9093';\n  CREATE NAMED COLLECTION IF NOT EXISTS warpstream_traces AS kafka_broker_list = 'posthog-redpanda.posthog.svc.cluster.local:9093';\n  CREATE NAMED COLLECTION IF NOT EXISTS warpstream_metrics AS kafka_broker_list = 'posthog-redpanda.posthog.svc.cluster.local:9093';\nEOSQL\n\necho \"Flushing logs to create system log tables...\"\nclickhouse client --database system --password \"${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}\" --query \"SYSTEM FLUSH LOGS\"\n\necho \"Waiting for system log tables...\"\nfor i in $(seq 1 30); do\n  COUNT=$(clickhouse client --database system --password \"${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}\" --query \"\n    SELECT count()\n    FROM system.tables\n    WHERE database = 'system'\n      AND name IN ('crash_log', 'error_log', 'metric_log')\n  \")\n  if [ \"$COUNT\" = \"3\" ]; then\n    echo \"System log tables ready\"\n    exit 0\n  fi\n  echo \"  $COUNT/3 tables ready, retrying in 2s...\"\n  sleep 2\ndone\n\necho \"Timed out waiting for system log tables\" >&2\nexit 1\n"
  }
}
