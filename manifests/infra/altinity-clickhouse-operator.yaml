apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: altinity
  namespace: posthog
spec:
  url: https://helm.altinity.com
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse-operator
  namespace: posthog
spec:
  interval: 1h
  chart:
    spec:
      chart: altinity-clickhouse-operator
      sourceRef:
        kind: HelmRepository
        name: altinity
        namespace: posthog
      version: "0.27.0"
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    crdHook:
      image:
        repository: docker.io/bitnami/kubectl
        tag: latest@sha256:f7f9e4f64d9e114650c115a4ac6fd383394b3d494061a8f17b1a0f6c8d55bc25
        pullPolicy: IfNotPresent
    operator:
      image:
        registry: docker.io
        repository: altinity/clickhouse-operator
        pullPolicy: IfNotPresent
    metrics:
      enabled: false
