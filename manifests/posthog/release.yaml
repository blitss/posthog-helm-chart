apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: posthog
  namespace: posthog
spec:
  interval: 5m
  timeout: 45m
  chartRef:
    kind: OCIRepository
    name: posthog-chart
  dependsOn:
    - name: clickhouse-operator
  install:
    ## Skip Flux's stalled-resource wait — web/cymbal/worker need the create-buckets
    ## and migrate hooks to complete first, which happens after resource apply.
    ## Helm hooks themselves still run and are waited on.
    disableWait: true
    remediation:
      retries: 5
  upgrade:
    cleanupOnFail: true
    disableWait: true
    remediation:
      retries: 5
  values:
    ingress:
      enabled: true
      hostname: posthog.example.com
      nginx:
        enabled: false
      traefik:
        enabled: false
      gateway:
        enabled: true
        gatewayName: posthog-gateway
        gatewayNamespace: traefik
        listenerName: posthog-https
    posthog:
      optOutCapture: true
      image:
        repository: ghcr.io/blitss/posthog-web
        tag: latest@sha256:eef663d21a9aaa8499218128c12bcb52fa8352658f3da7cda2b408105f7b89fe
        pullPolicy: Always
      env:
        MULTI_ORG_ENABLED: "0"
      secretEnv:
        OIDC_RSA_PRIVATE_KEY:
          name: posthog-oidc-generated
          key: tls.key
    web:
      enabled: true
      image:
        repository: ghcr.io/blitss/posthog-web
        tag: latest@sha256:eef663d21a9aaa8499218128c12bcb52fa8352658f3da7cda2b408105f7b89fe
        pullPolicy: Always
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
    postgresql:
      enabled: false
    externalPostgresql:
      host: posthog-pg-rw
      port: 5432
      database: posthog
      personsDatabase: posthog_persons
      secretName: posthog-pg-app
      usernameKey: username
      passwordKey: password
    clickhouse:
      enabled: false
      database: posthog
    externalClickhouse:
      host: clickhouse-posthog.posthog.svc.cluster.local
      user: default
      apiUser: api
      appUser: app
      cluster: posthog
      secretName: posthog-clickhouse-password
      secretPasswordKey: password
      dictReaderUser: dict_reader
    kafka:
      enabled: false
    kafkaInit:
      image:
        repository: bitnamilegacy/kafka
        tag: 4.0@sha256:f45d5b813412e1ef7ce67b467309a84e4c6dc03d7626a0b6da867db9b69bd107
        pullPolicy: IfNotPresent
    externalKafka:
      brokers: posthog-redpanda.posthog.svc.cluster.local:9093
    redis:
      enabled: true
      persistence:
        enabled: false
      maxmemory: 96mb
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
    elasticsearch:
      enabled: false
    externalElasticsearch:
      host: posthog-elastic-es-http.posthog.svc.cluster.local
      scheme: http
      user: elastic
      secretName: posthog-elastic-es-elastic-user
      passwordKey: elastic
      version: v8
    zookeeper:
      enabled: false
    minio:
      enabled: false
    rustfs:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    seaweedfs:
      enabled: false
    objectStorage:
      enabled: true
    externalObjectStorage:
      endpoint: https://example.r2.cloudflarestorage.com
      accessKey: ""
      secretKey: ""
    externalSeaweedfs:
      endpoint: https://example.r2.cloudflarestorage.com
      accessKey: ""
      secretKey: ""
    temporal:
      enabled: true
      server:
        image:
          repository: docker.io/temporalio/auto-setup
          tag: 1.29.7@sha256:f14912b699cf73015ad5c4fc18d522d4b014db90e794039214dfb7c022c2644f
      adminTools:
        image:
          repository: docker.io/temporalio/admin-tools
          tag: 1.32.0@sha256:a9f84fb9a374b2374fe2e67c8efc0468ff3f1c66c8a0b14597ec86e349e62bca
      ui:
        image:
          repository: docker.io/temporalio/ui
          tag: 2.54.1@sha256:ff0943fe532b8e33c46cd28b29e81e0ce0b6f55b9ee50a38ef1b437cc4de3fa5
    worker:
      image:
        repository: ghcr.io/blitss/posthog-worker
        tag: latest@sha256:6db8e52e4876ca57af235ec502118bd525175e6263ae36fb5537dde592548cdb
        pullPolicy: Always
      replicas: 1
      concurrency: 2
      autoscaling:
        enabled: false
        minReplicas: 1
        maxReplicas: 4
        targetCPUUtilizationPercentage: 70
        targetMemoryUtilizationPercentage: 80
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
    workerBeat:
      enabled: true
      image:
        repository: ghcr.io/blitss/posthog-worker
        tag: latest@sha256:6db8e52e4876ca57af235ec502118bd525175e6263ae36fb5537dde592548cdb
        pullPolicy: Always
      replicas: 1
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi
    workerExports:
      enabled: true
      image:
        repository: ghcr.io/blitss/posthog-worker-exports
        tag: latest@sha256:6ccf47d6912e3438708dfac5a21f281ea8b793ee53549e39d0cd301e5705833c
        pullPolicy: Always
      replicas: 1
      queue: exports
      concurrency: 1
      autoscaling:
