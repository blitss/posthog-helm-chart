apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: posthog
  namespace: posthog
spec:
  interval: 5m
  timeout: 45m
  chartRef:
    kind: OCIRepository
    name: posthog-chart
  dependsOn:
    - name: clickhouse-operator
  install:
    ## Skip Flux's stalled-resource wait — web/cymbal/worker need the create-buckets
    ## and migrate hooks to complete first, which happens after resource apply.
    ## Helm hooks themselves still run and are waited on.
    disableWait: true
    remediation:
      retries: 5
  upgrade:
    cleanupOnFail: true
    disableWait: true
    remediation:
      retries: 5
  values:
    ingress:
      enabled: true
      hostname: posthog.example.com
      nginx:
        enabled: false
      traefik:
        enabled: false
      gateway:
        enabled: true
        gatewayName: posthog-gateway
        gatewayNamespace: traefik
        listenerName: posthog-https

    posthog:
      optOutCapture: true
      image:
        repository: ghcr.io/blitss/posthog-web
        tag: latest@sha256:bdb4b9e27f082e056f44bfd7ab8ef639313444e55ee1b791191074de8d0c0883
        pullPolicy: Always
      env:
        # Allows creating multiple organizations in your instance (multi-tenancy). Requires a premium license.
        MULTI_ORG_ENABLED: "0"
      secretEnv:
        OIDC_RSA_PRIVATE_KEY:
          name: posthog-oidc-generated
          key: tls.key
    web:
      enabled: true
      image:
        repository: ghcr.io/blitss/posthog-web
        tag: latest@sha256:bdb4b9e27f082e056f44bfd7ab8ef639313444e55ee1b791191074de8d0c0883
        pullPolicy: Always
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi

    ## PostgreSQL — CNPG (external)
    postgresql:
      enabled: false
    externalPostgresql:
      host: posthog-pg-rw
      port: 5432
      database: posthog
      personsDatabase: posthog_persons
      cyclotronDatabase: cyclotron
      secretName: posthog-pg-app
      usernameKey: username
      passwordKey: password

    ## ClickHouse — Altinity operator (external)
    clickhouse:
      enabled: false
      database: posthog
    externalClickhouse:
      host: clickhouse-posthog.posthog.svc.cluster.local
      user: default
      apiUser: api
      appUser: app
      logsDatabase: default
      cluster: posthog
      secretName: posthog-clickhouse-password
      secretPasswordKey: password

    ## Kafka — Redpanda via operator (external)
    kafka:
      enabled: false
    kafkaInit:
      image:
        repository: bitnamilegacy/kafka
        tag: "4.0@sha256:f45d5b813412e1ef7ce67b467309a84e4c6dc03d7626a0b6da867db9b69bd107"
        pullPolicy: IfNotPresent
    externalKafka:
      brokers: posthog-redpanda.posthog.svc.cluster.local:9093

    ## Redis — bundled via chart. Elasticsearch is managed by ECK.
    redis:
      enabled: true
      persistence:
        enabled: false
      maxmemory: 96mb
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
    elasticsearch:
      enabled: false
    externalElasticsearch:
      host: posthog-elastic-es-http.posthog.svc.cluster.local
      scheme: http
      user: elastic
      secretName: posthog-elastic-es-elastic-user
      passwordKey: elastic
      version: v8
    zookeeper:
      enabled: false
    minio:
      enabled: false
    rustfs:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    seaweedfs:
      enabled: false
    objectStorage:
      enabled: true
    externalObjectStorage:
      # The chart uses the fixed bucket name "posthog".
      endpoint: https://example.r2.cloudflarestorage.com
      accessKey: ""
      secretKey: ""
    externalSeaweedfs:
      # Session recordings also target the fixed bucket name "posthog".
      endpoint: https://example.r2.cloudflarestorage.com
      accessKey: ""
      secretKey: ""
    temporal:
      enabled: true
      server:
        image:
          repository: docker.io/temporalio/auto-setup
          tag: "1.29.7@sha256:f14912b699cf73015ad5c4fc18d522d4b014db90e794039214dfb7c022c2644f"
      adminTools:
        image:
          repository: docker.io/temporalio/admin-tools
          tag: "1.32.0@sha256:a9f84fb9a374b2374fe2e67c8efc0468ff3f1c66c8a0b14597ec86e349e62bca"
      ui:
        image:
          repository: docker.io/temporalio/ui
          tag: "2.54.1@sha256:ff0943fe532b8e33c46cd28b29e81e0ce0b6f55b9ee50a38ef1b437cc4de3fa5"
    worker:
      image:
        repository: ghcr.io/blitss/posthog-worker
        tag: latest@sha256:c8cbcc21544a1f899468143fe3d414fa385e5fd7d1dbba45310b6c06333b2640
        pullPolicy: Always
      replicas: 1
      concurrency: 2
      autoscaling:
        enabled: false
        minReplicas: 1
        maxReplicas: 4
        targetCPUUtilizationPercentage: 70
        targetMemoryUtilizationPercentage: 80
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
    workerBeat:
      enabled: true
      image:
        repository: ghcr.io/blitss/posthog-worker
        tag: latest@sha256:c8cbcc21544a1f899468143fe3d414fa385e5fd7d1dbba45310b6c06333b2640
        pullPolicy: Always
      replicas: 1
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi
    workerExports:
      enabled: true
      image:
        repository: ghcr.io/blitss/posthog-worker-exports
        tag: latest@sha256:18f6f9b13b864b6b097e67c42307b0b7a939f1b487a367f5efb82216d0929f0a
        pullPolicy: Always
      replicas: 1
      queue: exports
      concurrency: 1
      autoscaling:
        enabled: false
        minReplicas: 1
        maxReplicas: 3
        targetCPUUtilizationPercentage: 70
        targetMemoryUtilizationPercentage: 80
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
    temporalDjangoWorker:
      image:
        repository: ghcr.io/blitss/posthog-worker
        tag: latest@sha256:c8cbcc21544a1f899468143fe3d414fa385e5fd7d1dbba45310b6c06333b2640
        pullPolicy: Always
      replicas: 1
      autoscaling:
        enabled: false
        minReplicas: 1
        maxReplicas: 3
        targetCPUUtilizationPercentage: 70
        targetMemoryUtilizationPercentage: 80
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
    migrate:
      image:
        repository: ghcr.io/blitss/posthog-migrate
        tag: latest@sha256:7e1c6d2454059b76a85ec77180f43b0d93bfa09bbd95f159c447a6ab0d9346e1
        pullPolicy: Always
    asyncMigrationsCheck:
      image:
        repository: ghcr.io/blitss/posthog-migrate
        tag: latest@sha256:7e1c6d2454059b76a85ec77180f43b0d93bfa09bbd95f159c447a6ab0d9346e1
        pullPolicy: Always
    plugins:
      image:
        # docker.io/posthog/posthog-node:latest is frozen @863e (no
        # cdp-hogflow-scheduler / cdp-cyclotron-v2-janitor modes), so the
        # enabled scheduler/janitor pods CrashLoop. Use current ghcr master.
        repository: ghcr.io/posthog/posthog-node
        tag: master@sha256:5b3fa43605cf50359f2433ec88993e390c33eedba7c508ec90744d244534540a
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    capture:
      image:
        repository: ghcr.io/posthog/posthog/capture
        tag: master@sha256:9b166761f1e282880a76fb4f3e66afad9ba954fe383581dc5e0074a729c5c99e
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    replayCapture:
      image:
        repository: ghcr.io/posthog/posthog/capture
        tag: master@sha256:9b166761f1e282880a76fb4f3e66afad9ba954fe383581dc5e0074a729c5c99e
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    captureAi:
      image:
        repository: ghcr.io/posthog/posthog/capture
        tag: master@sha256:9b166761f1e282880a76fb4f3e66afad9ba954fe383581dc5e0074a729c5c99e
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    captureLogs:
      image:
        repository: ghcr.io/posthog/posthog/capture-logs
        tag: master@sha256:cd328b86a9e04f168fcbaef1d3bddf8f8a5c1f5ca2527231f7bf2946c459e833
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
    featureFlags:
      image:
        repository: ghcr.io/posthog/posthog/feature-flags
        tag: master@sha256:b18bbe7ee20276cf0395cc649fe9d90c2c7d0ef836dd30c8789b3a09de73a8cc
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
    hypercacheServer:
      image:
        repository: ghcr.io/posthog/posthog/hypercache-server
        tag: master@sha256:f247133dfff4073a65df38eb04589683c6f43cf1f4f41272152a5d2d5b07ebcd
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
    propertyDefsRs:
      image:
        repository: ghcr.io/posthog/posthog/property-defs-rs
        tag: master@sha256:f114a4c8218eb31cd8bbf21bf62067908a64987a8de1c6ccb34af226cbe0fc90
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
    livestream:
      enabled: true
      image:
        repository: ghcr.io/posthog/posthog/livestream
        tag: master@sha256:6926f340b72d609e43cee5aa8b75a85cfdc77d182e610dafafdd81d3b2ab53f5
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
    cymbal:
      image:
        repository: ghcr.io/posthog/posthog/cymbal
        tag: master@sha256:7aa97c8583c3f787cb54249eebc31d1a875b2e848b88abb8c2a038d04083c1f8
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    cyclotronJanitor:
      image:
        repository: ghcr.io/posthog/posthog/cyclotron-janitor
        tag: master@sha256:664e6f6dd6247aa94bc9d7f554d81b714fc8406a455bc0a35165a2e56b35ea91
    ## Keep this manifest schedulable on a single-node kind cluster while
    ## still deploying the full happy-path service graph.
    ingestionGeneral:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    ingestionSessionReplay:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    recordingApi:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    ingestionErrorTracking:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    ingestionLogs:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    ingestionTraces:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    ## Personhog services — route all persons reads through the in-cluster router.
    personhog:
      enabled: true
      rolloutPercentage: 100
    personhogReplica:
      enabled: true
      image:
        repository: ghcr.io/posthog/posthog/personhog-replica
        tag: master@sha256:b4a9dd4e5a25e90fd2c2d3e7e0adbf807b10c28f834cb719c22da67b74e64dbe
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
    personhogRouter:
      enabled: true
      image:
        repository: ghcr.io/posthog/posthog/personhog-router
        tag: master@sha256:437c4b698ae32614ce5e7b106f6f7555a08e765442dcce545514a1c371126754
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
    global:
      containerSecurityContext: {}
      podSecurityContext: {}
    networkPolicies:
      enabled: false
