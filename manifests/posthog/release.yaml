      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
    migrate:
      image:
        repository: ghcr.io/blitss/posthog-migrate
        tag: latest@sha256:8dc9448458117f09e4bb9264a32f6101141a5f8a1f9f5ec3dad2314cefc46eb5
