apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: posthog
  namespace: posthog
spec:
  interval: 5m
  timeout: 45m
  chartRef:
    kind: OCIRepository
    name: posthog-chart
  dependsOn:
    - name: clickhouse-operator
  install:
    ## Skip Flux's stalled-resource wait — web/cymbal/worker need the create-buckets
    ## and migrate hooks to complete first, which happens after resource apply.
    ## Helm hooks themselves still run and are waited on.
    disableWait: true
    remediation:
      retries: 5
  upgrade:
    cleanupOnFail: true
    disableWait: true
    remediation:
      retries: 5
  values:
    ingress:
      enabled: true
      hostname: posthog.example.com
      nginx:
        enabled: false
      traefik:
        enabled: false
      gateway:
        enabled: true
        gatewayName: posthog-gateway
        gatewayNamespace: traefik
        listenerName: posthog-https

    posthog:
      optOutCapture: true
      image:
        repository: ghcr.io/blitss/posthog-web
        tag: latest@sha256:bdb4b9e27f082e056f44bfd7ab8ef639313444e55ee1b791191074de8d0c0883
        pullPolicy: Always
      env:
        # Allows creating multiple organizations in your instance (multi-tenancy). Requires a premium license.
        MULTI_ORG_ENABLED: "0"
      secretEnv:
        OIDC_RSA_PRIVATE_KEY:
          name: posthog-oidc-generated
          key: tls.key
    web:
      enabled: true
      image:
        repository: ghcr.io/blitss/posthog-web
        tag: latest@sha256:bdb4b9e27f082e056f44bfd7ab8ef639313444e55ee1b791191074de8d0c0883
        pullPolicy: Always
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi

    ## PostgreSQL — CNPG (external)
    postgresql:
      enabled: false
    externalPostgresql:
      host: posthog-pg-rw
      port: 5432
      database: posthog
      personsDatabase: posthog_persons
      cyclotronDatabase: cyclotron
      secretName: posthog-pg-app
      usernameKey: username
      passwordKey: password

    ## ClickHouse — Altinity operator (external)
    clickhouse:
      enabled: false
      database: posthog
    externalClickhouse:
      host: clickhouse-posthog.posthog.svc.cluster.local
      user: default
      apiUser: api
      appUser: app
      logsDatabase: default
      cluster: posthog
      secretName: posthog-clickhouse-password
      secretPasswordKey: password

    ## Kafka — Redpanda via operator (external)
    kafka:
      enabled: false
    kafkaInit:
      image:
        repository: bitnamilegacy/kafka
        tag: "4.0@sha256:f45d5b813412e1ef7ce67b467309a84e4c6dc03d7626a0b6da867db9b69bd107"
        pullPolicy: IfNotPresent
    externalKafka:
      brokers: posthog-redpanda.posthog.svc.cluster.local:9093

    ## Redis — bundled via chart. Elasticsearch is managed by ECK.
    redis:
      enabled: true
      persistence:
        enabled: false
      maxmemory: 96mb
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
    elasticsearch:
      enabled: false
    externalElasticsearch:
      host: posthog-elastic-es-http.posthog.svc.cluster.local
      scheme: http
      user: elastic
      secretName: posthog-elastic-es-elastic-user
      passwordKey: elastic
      version: v8
    zookeeper:
      enabled: false
    minio:
      enabled: false
    rustfs:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    seaweedfs:
      enabled: false
    objectStorage:
      enabled: true
    externalObjectStorage:
      # The chart uses the fixed bucket name "posthog".
      endpoint: https://example.r2.cloudflarestorage.com
      accessKey: ""
      secretKey: ""
    externalSeaweedfs:
      # Session recordings also target the fixed bucket name "posthog".
      endpoint: https://example.r2.cloudflarestorage.com
      accessKey: ""
      secretKey: ""
    temporal:
      enabled: true
      server:
        image:
          repository: docker.io/temporalio/auto-setup
          tag: "1.29.6@sha256:1263120feed69d82e4ca23b8ca6f1d702c3029fe70714e382966d0192318eab6"
      adminTools:
        image:
          repository: docker.io/temporalio/admin-tools
          tag: "1.31.0@sha256:3e68adcd54195a7c1222e99f2dbc32a4fdbf44ad69e3bb48e21e85c4bf417c2e"
      ui:
        image:
          repository: docker.io/temporalio/ui
          tag: "2.50.0@sha256:49a61456f6b770af926d6d7d74f63ebb4b9a3c5abc4fb68ddb146321d49391e4"
    worker:
      image:
        repository: ghcr.io/blitss/posthog-worker
        tag: latest@sha256:c8cbcc21544a1f899468143fe3d414fa385e5fd7d1dbba45310b6c06333b2640
        pullPolicy: Always
      replicas: 1
      concurrency: 2
      autoscaling:
        enabled: false
        minReplicas: 1
        maxReplicas: 4
        targetCPUUtilizationPercentage: 70
        targetMemoryUtilizationPercentage: 80
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
    workerBeat:
      enabled: true
      image:
        repository: ghcr.io/blitss/posthog-worker
        tag: latest@sha256:c8cbcc21544a1f899468143fe3d414fa385e5fd7d1dbba45310b6c06333b2640
        pullPolicy: Always
      replicas: 1
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi
    workerExports:
      enabled: true
      image:
        repository: ghcr.io/blitss/posthog-worker-exports
        tag: latest@sha256:18f6f9b13b864b6b097e67c42307b0b7a939f1b487a367f5efb82216d0929f0a
        pullPolicy: Always
      replicas: 1
      queue: exports
      concurrency: 1
      autoscaling:
        enabled: false
        minReplicas: 1
        maxReplicas: 3
        targetCPUUtilizationPercentage: 70
        targetMemoryUtilizationPercentage: 80
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
    temporalDjangoWorker:
      image:
        repository: ghcr.io/blitss/posthog-worker
        tag: latest@sha256:c8cbcc21544a1f899468143fe3d414fa385e5fd7d1dbba45310b6c06333b2640
        pullPolicy: Always
      replicas: 1
      autoscaling:
        enabled: false
        minReplicas: 1
        maxReplicas: 3
        targetCPUUtilizationPercentage: 70
        targetMemoryUtilizationPercentage: 80
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
    migrate:
      image:
        repository: ghcr.io/blitss/posthog-migrate
        tag: latest@sha256:7e1c6d2454059b76a85ec77180f43b0d93bfa09bbd95f159c447a6ab0d9346e1
        pullPolicy: Always
    asyncMigrationsCheck:
      image:
        repository: ghcr.io/blitss/posthog-migrate
        tag: latest@sha256:7e1c6d2454059b76a85ec77180f43b0d93bfa09bbd95f159c447a6ab0d9346e1
        pullPolicy: Always
    plugins:
      image:
        repository: docker.io/posthog/posthog-node
        tag: latest@sha256:863e76e040ad41aef79f605c33ec71f1529bddf94cfd88941c935da9bde97235
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    capture:
      image:
        repository: ghcr.io/posthog/posthog/capture
        tag: master@sha256:ecb6da073ddb396f04ded2965880ad1abb581d49127bbc7e9f203bec659ab119
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    replayCapture:
      image:
        repository: ghcr.io/posthog/posthog/capture
        tag: master@sha256:ecb6da073ddb396f04ded2965880ad1abb581d49127bbc7e9f203bec659ab119
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    captureAi:
      image:
        repository: ghcr.io/posthog/posthog/capture
        tag: master@sha256:ecb6da073ddb396f04ded2965880ad1abb581d49127bbc7e9f203bec659ab119
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    captureLogs:
      image:
        repository: ghcr.io/posthog/posthog/capture-logs
        tag: master@sha256:98440e32007250dd25f81074bf3bb36ba79e5560ddbedc668aae67ab5105d6c7
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
    featureFlags:
      image:
        repository: ghcr.io/posthog/posthog/feature-flags
        tag: master@sha256:74e808832a2702a3c36fb511a3217b978940b6c9fe854ae36b7c0067b13a4fb3
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
    hypercacheServer:
      image:
        repository: ghcr.io/posthog/posthog/hypercache-server
        tag: master@sha256:833db9fb0ab7948bf76546171d412b9a93215b925ad73526767e9ef0a69f1bce
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
    propertyDefsRs:
      image:
        repository: ghcr.io/posthog/posthog/property-defs-rs
        tag: master@sha256:b90d7b17c5340fa329fb78b3a46464b85ce31de8254c457b311b4051d238bbf6
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
    livestream:
      enabled: true
      image:
        repository: ghcr.io/posthog/posthog/livestream
        tag: master@sha256:380beeb2220ecb07c38d9215db54c1ced3191787c81164a99766d01720e2c40c
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
    cymbal:
      image:
        repository: ghcr.io/posthog/posthog/cymbal
        tag: master@sha256:824d53a12a1c7075e47b6a7af3159cd909edf0febe0030410d7278ca061ad76c
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    cyclotronJanitor:
      image:
        repository: ghcr.io/posthog/posthog/cyclotron-janitor
        tag: master@sha256:313016aa35e11a4646ac036b7d3305de325760b3303f8ee4ef29b0f8aa96bc58
    ## Keep this manifest schedulable on a single-node kind cluster while
    ## still deploying the full happy-path service graph.
    ingestionGeneral:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    ingestionSessionReplay:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    recordingApi:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    ingestionErrorTracking:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    ingestionLogs:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    ingestionTraces:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    ## Personhog services — route all persons reads through the in-cluster router.
    personhog:
      enabled: true
      rolloutPercentage: 100
    personhogReplica:
      enabled: true
      image:
        repository: ghcr.io/posthog/posthog/personhog-replica
        tag: master@sha256:d807eceee91ec7ebfc3b09e3a16890d5c3c86d484f4ba936c43e44379420ae6e
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
    personhogRouter:
      enabled: true
      image:
        repository: ghcr.io/posthog/posthog/personhog-router
        tag: master@sha256:15558bd459caa9fa6d6d1fcffab8ce5bcfe4ef3579c4872cb3fec0bf0896ad8b
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
    global:
      containerSecurityContext: {}
      podSecurityContext: {}
    networkPolicies:
      enabled: false
