{{- if .Values.metrics.enabled }}
{{- $v := .Values }}
{{- $sm := .Values.metrics.serviceMonitor }}
{{- range $c := list
  (dict "name" "web" "on" $v.web.enabled "port" "metrics" "path" "/metrics")
  (dict "name" "plugins" "on" $v.plugins.enabled "port" "http" "path" "/preflight")
  (dict "name" "capture" "on" $v.capture.enabled "port" "http" "path" "/_readiness")
  (dict "name" "personhog-replica" "on" $v.personhogReplica.enabled "port" "metrics")
  (dict "name" "personhog-router" "on" $v.personhogRouter.enabled "port" "metrics")
  (dict "name" "cymbal-resolution" "on" $v.cymbalResolution.enabled "port" "metrics")
}}
{{- if $c.on }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "posthog.fullname" $ }}-{{ $c.name }}
  labels:
    {{- include "posthog.componentLabels" (dict "root" $ "component" $c.name) | nindent 4 }}
    {{- with $sm.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "posthog.componentSelectorLabels" (dict "root" $ "component" $c.name) | nindent 6 }}
  endpoints:
    - port: {{ $c.port }}
      interval: {{ $sm.interval }}
      scrapeTimeout: {{ $sm.scrapeTimeout }}
      {{- with $c.path }}
      path: {{ . }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
