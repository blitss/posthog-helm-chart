{{/*
  Create S3 buckets on the bundled RustFS instance.
  A plain Job, not a hook: ingestion exits until the AI blob bucket exists, so
  bucket creation must not queue behind (or hold back) the migration hooks.
  Jobs are immutable; the revision in the name gives every upgrade a new one
  and lets Helm delete the previous one.
  Skipped when using external object storage (rustfs.enabled=false).
*/}}
{{- if .Values.rustfs.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "posthog.fullname" . }}-create-buckets-{{ .Release.Revision }}
  labels:
    {{- include "posthog.componentLabels" (dict "root" . "component" "create-buckets") | nindent 4 }}
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "posthog.componentSelectorLabels" (dict "root" . "component" "create-buckets") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        {{- include "posthog.ensureBucketsContainer" (dict "root" . "name" "create-buckets" "buckets" (list "posthog" .Values.objectStorage.aiBlobs.bucket)) | nindent 8 }}
{{- end }}
