{{- if not .Values.existingSecret }}
{{- $secretName := printf "%s-secrets" (include "posthog.fullname" .) -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
{{- $existingData := $existingSecret.data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* Preserve posthog-secret across upgrades; generate only on first install */}}
  posthog-secret: {{ .Values.posthog.secret | default (index $existingData "posthog-secret" | default "" | b64dec) | default (randAlphaNum 56) | quote }}
  {{- /* Preserve encryption-salt-keys across upgrades */}}
  encryption-salt-keys: {{ .Values.posthog.encryptionSaltKeys | default (index $existingData "encryption-salt-keys" | default "" | b64dec) | default (randAlphaNum 32) | quote }}
  {{- /* Shared secret for Django internal API auth (e.g. HogFlow scheduler); preserve across upgrades */}}
  internal-api-secret: {{ .Values.posthog.internalApiSecret | default (index $existingData "internal-api-secret" | default "" | b64dec) | default (randAlphaNum 48) | quote }}
  {{- if .Values.browserless.enabled }}
  {{- /* Renderer credentials must never reuse Django's signing key. */}}
  browserless-token: {{ .Values.browserless.token | default (index $existingData "browserless-token" | default "" | b64dec) | default (randAlphaNum 64) | quote }}
  {{- else }}
  {{- if .Values.externalBrowserless.cdpUrl }}
  browserless-token: {{ required "externalBrowserless.token is required with externalBrowserless.cdpUrl (or use existingSecret)" .Values.externalBrowserless.token | quote }}
  {{- end }}
  {{- if .Values.externalBrowserless.heatmapUrl }}
  heatmap-browserless-token: {{ required "externalBrowserless.heatmapToken is required with externalBrowserless.heatmapUrl (or use existingSecret)" .Values.externalBrowserless.heatmapToken | quote }}
  {{- end }}
  {{- end }}
  database-url: {{ include "posthog.databaseUrl" . | quote }}
  redis-url: {{ include "posthog.redisUrl" . | quote }}
  {{- if .Values.valkey.enabled }}
  valkey-password: {{ .Values.valkey.password | default (index $existingData "valkey-password" | default "" | b64dec) | default (randAlphaNum 48) | quote }}
  {{- else }}
  valkey-password: {{ .Values.externalValkey.password | quote }}
  {{- end }}
  {{- if .Values.mcp.enabled }}
  {{- /* Preserve the MCP confirmed-action signing key across upgrades */}}
  mcp-signed-state-key: {{ .Values.mcp.signedStateKey | default (index $existingData "mcp-signed-state-key" | default "" | b64dec) | default (randAlphaNum 64) | quote }}
  {{- end }}
  {{- if .Values.clickhouse.enabled }}
  clickhouse-api-password: {{ .Values.clickhouse.apiPassword | default "apipass" | quote }}
  clickhouse-app-password: {{ .Values.clickhouse.appPassword | default "apppass" | quote }}
  {{- end }}
  {{- if .Values.rustfs.enabled }}
  object-storage-access-key: {{ .Values.rustfs.secret.rustfs.access_key | quote }}
  object-storage-secret-key: {{ .Values.rustfs.secret.rustfs.secret_key | quote }}
  seaweedfs-access-key: {{ .Values.rustfs.secret.rustfs.access_key | quote }}
  seaweedfs-secret-key: {{ .Values.rustfs.secret.rustfs.secret_key | quote }}
  {{- else }}
  object-storage-access-key: {{ .Values.externalObjectStorage.accessKey | quote }}
  object-storage-secret-key: {{ .Values.externalObjectStorage.secretKey | quote }}
  seaweedfs-access-key: {{ .Values.externalSeaweedfs.accessKey | default "any" | quote }}
  seaweedfs-secret-key: {{ .Values.externalSeaweedfs.secretKey | default "any" | quote }}
  {{- end }}
  {{- /* Always include postgresql-password — needed by Temporal and other consumers */}}
  {{- if .Values.postgresql.enabled }}
  postgresql-password: {{ .Values.postgresql.auth.password | quote }}
  {{- else }}
  postgresql-password: {{ .Values.externalPostgresql.password | default "posthog" | quote }}
  {{- end }}
{{- end }}
