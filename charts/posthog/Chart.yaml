apiVersion: v2
name: posthog
description: Community Helm chart to deploy PostHog - open-source product analytics platform
type: application
version: 0.23.0
appVersion: 8471862b083b25d3a11b97eb7730f21aa0cb4c7f
## Highest in-tree APIs used: autoscaling/v2 (GA 1.23), policy/v1 (GA 1.21).
kubeVersion: '>= 1.23.0-0'
keywords:
- posthog
- analytics
- product-analytics
- event-tracking
home: https://github.com/blitss/posthog-helm-chart
icon: https://raw.githubusercontent.com/PostHog/posthog/master/frontend/public/posthog-icon.svg
sources:
- https://github.com/blitss/posthog-helm-chart
- https://github.com/PostHog/posthog
maintainers:
- name: blitss
  url: https://github.com/blitss

dependencies:
  - name: kafka
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 29.3.14
    condition: kafka.enabled
  - name: rustfs
    repository: https://charts.rustfs.com
    version: 0.0.91
    condition: rustfs.enabled
